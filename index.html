      const INIT_USERS = [{ id:1, name:"Admin", email:"admin@motoxuniverse.app", password:"admin123", role:"admin", status:"active" }];

      const submit = async e => {
        e.preventDefault(); setLoading(true); setErr("");
        try {
          const d = await callApi({ action: "users_read" });
          const users = (d.users && d.users.length) ? d.users : INIT_USERS;
          const u = users.find(u => u.email === email && u.password === pass && u.status === "active");
          if (u) onLogin(u);
          else setErr("Invalid credentials or account inactive.");
        } catch (e) {
          const u = INIT_USERS.find(u => u.email === email && u.password === pass && u.status === "active");

          else setErr("Could not connect to server. Check your connection and try again.");

              <div style={{ display:"inline-flex", alignItems:"center", gap:12, marginBottom:8 }}>
                <div style={{ width:44, height:44, background:C.text, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8"><circle cx="5.5" cy="17.5" r="3"/><circle cx="18.5" cy="17.5" r="3"/><path d="M15 6h-3l-2.5 5.5H5.5M15 6l3 5.5M15 6l1-3h2"/></svg>

                <div>
                  <div style={{ fontFamily: C.display, fontSize:22, fontWeight:800, color:C.text, letterSpacing:"0.02em", lineHeight:1 }}>MOTOXUNIVERSE</div>

                </div>
              </div>

            <div style={{ ...card, padding:"36px 32px" }}>
              <h2 style={{ fontSize:18, fontWeight:700, color:C.text, margin:"0 0 4px" }}>Sign In</h2>
              <p style={{ fontSize:13, color:C.text2, margin:"0 0 28px" }}>Authorized personnel only</p>
              <form onSubmit={submit}>
                <div style={{ marginBottom:16 }}>
                  <label style={lbl}>Email</label>
                  <FI type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="you@motoxuniverse.app" />
                </div>
                <div style={{ marginBottom:22 }}>
                  <label style={lbl}>Password</label>
                  <div style={{ position:"relative" }}>
                    <FI type={show?"text":"password"} value={pass} onChange={e=>setPass(e.target.value)} required placeholder="••••••••" style={{ paddingRight:40 }} />
                    <button type="button" onClick={()=>setShow(!show)} style={{ position:"absolute", right:12, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", color:C.text3, cursor:"pointer", padding:0 }}>
                      {show ? Ic.eyeoff : Ic.eye}
                    </button>
                  </div>
                </div>
                {err && <div style={{ background:C.redL, border:`1px solid ${C.red}33`, borderRadius:6, padding:"10px 14px", marginBottom:16, color:C.red, fontSize:13 }}>{err}</div>}
                <button type="submit" disabled={loading} style={{ ...btn, width:"100%", justifyContent:"center", background:loading?C.text2:C.text, color:"#fff", padding:"12px", fontSize:14, borderRadius:8 }}>
                  {loading ? "Signing in…" : "Sign In →"}
                </button>
              </form>
            </div>
            <div style={{ textAlign:"center", marginTop:20, fontSize:11, color:C.text3 }}>© 2026 MotoXUniverse · Parts Portal</div>

    };


    // ─── TOP NAV ───────────────────────────────────────────────────────────────
    const TopNav = ({ page, setPage, user, onLogout }) => {

        { id:"dashboard",  label:"Dashboard",     icon:Ic.ledger },

          <div style={{ display:"flex", alignItems:"center", gap:10, marginRight:32, flexShrink:0 }}>
            <div style={{ width:30, height:30, background:C.text, borderRadius:7, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8"><circle cx="5.5" cy="17.5" r="3"/><circle cx="18.5" cy="17.5" r="3"/><path d="M15 6h-3l-2.5 5.5H5.5M15 6l3 5.5M15 6l1-3h2"/></svg>
            </div>
            <span style={{ fontFamily:C.display, fontSize:16, fontWeight:800, color:C.text, letterSpacing:"0.03em" }}>MOTOXUNIVERSE</span>
          </div>
          <nav style={{ display:"flex", gap:2, flex:1 }}>
            {nav.map(n => (
              <button key={n.id} onClick={()=>setPage(n.id)} style={{ display:"flex", alignItems:"center", gap:7, padding:"6px 14px", borderRadius:7, background:page===n.id?C.bg:"none", border:"none", color:page===n.id?C.text:C.text2, fontSize:13, fontWeight:page===n.id?600:400, cursor:"pointer", fontFamily:"inherit", transition:"all 0.12s" }}>
                <span style={{ opacity:page===n.id?1:0.6 }}>{n.icon}</span> {n.label}

          </nav>
          <div style={{ position:"relative" }}>

              <div style={{ width:24, height:24, borderRadius:"50%", background:C.text, display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:700, color:"#fff" }}>{user.name[0]}</div>
              {user.name}
            </button>
            {menuOpen && (
              <div style={{ position:"absolute", top:"calc(100% + 6px)", right:0, background:C.white, border:`1px solid ${C.border}`, borderRadius:8, boxShadow:"0 4px 16px rgba(0,0,0,0.1)", minWidth:160, zIndex:99 }}>
                <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`, fontSize:12, color:C.text2 }}>
                  <div style={{ fontWeight:600, color:C.text }}>{user.name}</div>
                  <div style={{ fontSize:11, color:C.text3, textTransform:"uppercase", letterSpacing:"0.08em" }}>{user.role}</div>
                </div>
                <button onClick={()=>{ setMenuOpen(false); onLogout(); }} style={{ width:"100%", display:"flex", alignItems:"center", gap:8, padding:"10px 14px", background:"none", border:"none", color:C.red, fontSize:13, cursor:"pointer", fontFamily:"inherit" }}>
                  {Ic.out} Sign Out
                </button>

            )}
          </div>
        </header>
      );
    };

    // ─── PURCHASE LEDGER ───────────────────────────────────────────────────────
    // ─── DASHBOARD PAGE ──────────────────────────────────────────────────────
    const DashboardPage = ({ bikes, masterParts, flash, onChecklist, setPage }) => {
      const [rows, setRows]     = useState(null); // null = loading
      const totalParts = masterParts.length;

      useEffect(() => {
        let cancelled = false;
        if (bikes.length === 0) { setRows([]); return; }
        Promise.all(bikes.map(b => {
          const bikeSerial = b.internalSerial || (b.condition||"U")+(b.listingNum||"")+"-"+(b.bikeModel||"");
          return Promise.all([
            callApi({ action:"checklist_read", bikeSerial }).catch(()=>({items:[]})),
            callApi({ action:"sku_read" }).catch(()=>({items:[]}))
          ]).then(([cl, sk]) => {
            const checkedCount = (cl.items||[]).filter(i => i.onBike===true || String(i.onBike).toUpperCase()==="TRUE").length;
            const skuCount = (sk.items||[]).filter(i => i.bikeSerial===bikeSerial).length;
            let status = "New";
            if (skuCount > 0) status = "SKUs Generated";
            else if (checkedCount > 0) status = "Checklist In Progress";
            return { bike: b, bikeSerial, checkedCount, skuCount, status };
          });
        })).then(results => { if(!cancelled) setRows(results); });
        return () => { cancelled = true; };
      }, [bikes, masterParts]);

      const totalValue = bikes.reduce((s,b) => s + (parseFloat(b.purchasePrice)||0), 0);
      const inProgress = (rows||[]).filter(r => r.status==="Checklist In Progress").length;
      const skuDone    = (rows||[]).filter(r => r.status==="SKUs Generated").length;

      const kpi = (num, label) => (
        <div style={{ ...card, padding:16 }}>
          <div style={{ fontFamily:C.mono, fontSize:24, fontWeight:700, color:C.text }}>{num}</div>
          <div style={{ fontSize:12, color:C.text2, marginTop:2 }}>{label}</div>
        </div>
      );

      return (
        <div style={{ animation:"fadeIn 0.2s ease" }}>
          <div style={{ marginBottom:20 }}>
            <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>Dashboard</h1>
            <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>Overview of every bike in inventory.</p>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, marginBottom:24 }}>
            {kpi(bikes.length, "Bikes in inventory")}
            {kpi(inProgress, "Checklist in progress")}
            {kpi(skuDone, "SKUs generated")}
            {kpi(`$${totalValue.toLocaleString()}`, "Total purchase value")}
          </div>

          <div style={{ ...card, overflow:"hidden" }}>
            <div style={{ padding:"14px 16px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div style={{ fontSize:13, fontWeight:600, color:C.text }}>All Bikes</div>
              <button onClick={()=>setPage("ledger")} style={{ ...btn, background:C.text, color:"#fff", padding:"5px 12px", fontSize:12 }}>{Ic.plus} Add Bike</button>
            </div>
            {rows===null ? <Spinner /> : rows.length===0 ? (
              <div style={{ padding:40, textAlign:"center", color:C.text3, fontSize:13 }}>No bikes yet. Add your first one in the Ledger.</div>
            ) : rows.map(r => {
              const pct = totalParts ? Math.round((r.checkedCount/totalParts)*100) : 0;
              const statusStyle = r.status==="SKUs Generated" ? {bg:C.accentL,color:C.accentD} : r.status==="Checklist In Progress" ? {bg:C.orangeL,color:C.orange} : {bg:C.bg,color:C.text2};
              return (
                <div key={r.bike.id} onClick={()=>onChecklist(r.bike)}
                  style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 16px", borderTop:`1px solid ${C.border}`, cursor:"pointer" }}
                  onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <div>
                    <div style={{ fontFamily:C.mono, fontWeight:700, fontSize:14, color:C.text }}>{r.bike.condition}{r.bike.listingNum} — {r.bike.bikeModel}{r.bike.internalSerial?` · ${r.bike.internalSerial}`:""}</div>
                    <div style={{ fontSize:12, color:C.text2, marginTop:2 }}>{fmt$(r.bike.purchasePrice)}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:16 }}>
                    <div style={{ width:120, height:6, background:C.border, borderRadius:3, overflow:"hidden" }}>
                      <div style={{ width:`${pct}%`, height:"100%", background:C.accent }} />
                    </div>
                    <span style={{ fontSize:12, color:C.text2 }}>{r.checkedCount}/{totalParts} parts</span>
                    <span style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.03em", padding:"3px 9px", borderRadius:20, background:statusStyle.bg, color:statusStyle.color }}>{r.status}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const LedgerPage = ({ bikes, setBikes, flash, onChecklist }) => {
      const [showAdd, setShowAdd]     = useState(false);
      const [saving, setSaving]       = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [editData, setEditData]   = useState(null);
      const [search, setSearch]       = useState("");
      const [sortField, setSortField] = useState("listingNum"); // "Year" field
      const [sortDir, setSortDir]     = useState("desc");

      const blank = { condition:"U", listingNum:"", bikeModel:"", internalSerial:"", purchasePrice:"", driveFolderId:"", notes:"" };
      const [f, setF] = useState(blank);

      const buildRow = d => [d.condition||"U", d.listingNum||"", d.bikeModel||"", d.internalSerial||"", parseFloat(d.purchasePrice)||0, d.driveFolderId||"", d.notes||""];

      const handleAdd = async () => {
        if (!f.listingNum.trim()) { flash("⚠ Year is required"); return; }
        if (!f.bikeModel.trim()) { flash("⚠ Bike model is required"); return; }
        setSaving(true);
        try {
          const res = await callApi({ action:"ledger_append", values: buildRow(f) });
          if (res.error) throw new Error(res.error);
          const newBike = { ...f, id: f.internalSerial||(f.condition||"U")+(f.listingNum||"")+"-"+(f.bikeModel||""), _rowIndex: bikes.length + 2 };
          setBikes(prev => [...prev, newBike]);
          setShowAdd(false); setF(blank);
          flash("✓ Bike added to ledger");
        } catch(e) { console.error("saveAllChanges error:", e); flash("⚠ Save failed: " + e.message); }
        setSaving(false);
      };

      const saveEdit = async () => {
        if (!editData) return;
        setSaving(true);
        try {
          const res = await callApi({ action:"ledger_update", rowIndex: editData._rowIndex, values: buildRow(editData) });
          if (res.error) throw new Error(res.error);
          setBikes(prev => prev.map(b => b.id === editData.id ? { ...editData } : b));
          setEditingId(null); setEditData(null);
          flash("✓ Updated");
        } catch(e) { flash("⚠ Update failed: " + e.message); }
        setSaving(false);
      };

      const deleteBike = async (bike) => {
        if (!window.confirm(`Delete ${bike.serial}?`)) return;
        try {
          await callApi({ action:"ledger_delete", rowIndex: bike._rowIndex });
          setBikes(prev => prev.filter(b => b.id !== bike.id));
          flash("✓ Deleted");
        } catch { flash("⚠ Delete failed"); }
      };

      const filtered = bikes.filter(b => {
        if (!search) return true;
        const q = search.toLowerCase();
        return String(b.listingNum).toLowerCase().includes(q) || String(b.bikeModel).toLowerCase().includes(q) || String(b.internalSerial).toLowerCase().includes(q) || String(b.notes).toLowerCase().includes(q);
      }).sort((a, b) => {
        let av = a[sortField]||"", bv = b[sortField]||"";
        if (sortField==="purchasePrice") { av=parseFloat(av)||0; bv=parseFloat(bv)||0; }
        else { av=String(av).toLowerCase(); bv=String(bv).toLowerCase(); }
        if (av<bv) return sortDir==="asc"?-1:1;
        if (av>bv) return sortDir==="asc"?1:-1;
        return 0;
      });

      const toggleSort = f => { if(sortField===f) setSortDir(d=>d==="asc"?"desc":"asc"); else { setSortField(f); setSortDir("asc"); } };
      const sortIcon = f => sortField===f?(sortDir==="asc"?" ↑":" ↓"):"";
      const thStyle = () => ({ padding:"10px 14px", fontSize:11, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:C.text2, cursor:"pointer", whiteSpace:"nowrap", userSelect:"none", background:C.bg, borderBottom:`1px solid ${C.border}` });

      return (
        <div style={{ animation:"fadeIn 0.2s ease" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
            <div>
              <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>Purchase Ledger</h1>
              <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>{bikes.length} bike{bikes.length!==1?"s":""} in inventory · MotoXUniverse Parts Portal</p>
            </div>
            <button onClick={()=>setShowAdd(!showAdd)} style={{ ...btn, background:C.text, color:"#fff" }}>{Ic.plus} Add Bike</button>
          </div>

          {showAdd && (
            <div style={{ ...card, padding:24, marginBottom:20, animation:"fadeIn 0.15s ease" }}>
              <h3 style={{ fontSize:14, fontWeight:700, color:C.text, margin:"0 0 18px" }}>New Bike</h3>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px, 1fr))", gap:14 }}>
                <div><label style={lbl}>Condition *</label><select value={f.condition} onChange={e=>setF({...f,condition:e.target.value})} style={{...inp}}><option value="U">U — Used</option><option value="N">N — New</option></select></div>
                <div><label style={lbl}>Year *</label><FI value={f.listingNum} onChange={e=>setF({...f,listingNum:e.target.value})} placeholder="e.g. 05" /></div>
                <div><label style={lbl}>Bike Model *</label><FI value={f.bikeModel} onChange={e=>setF({...f,bikeModel:e.target.value})} placeholder="e.g. YZ450F" /></div>
                <div><label style={lbl}>Internal Serial</label><FI value={f.internalSerial} onChange={e=>setF({...f,internalSerial:e.target.value})} placeholder="e.g. 17" /></div>
                <div><label style={lbl}>Purchase Price ($)</label><FI type="number" value={f.purchasePrice} onChange={e=>setF({...f,purchasePrice:e.target.value})} placeholder="e.g. 600" /></div>
                <div><label style={lbl}>Drive Folder ID</label><FI value={f.driveFolderId} onChange={e=>setF({...f,driveFolderId:e.target.value})} placeholder="Google Drive folder ID" /></div>
                <div style={{ gridColumn:"1/-1" }}><label style={lbl}>Notes</label><FI value={f.notes} onChange={e=>setF({...f,notes:e.target.value})} placeholder="Optional notes" /></div>
              </div>
              <div style={{ display:"flex", gap:10, marginTop:18 }}>
                <button onClick={handleAdd} disabled={saving} style={{ ...btn, background:C.text, color:"#fff" }}>{saving?Ic.spin:Ic.check} {saving?"Saving…":"Save Bike"}</button>
                <button onClick={()=>{setShowAdd(false);setF(blank);}} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>Cancel</button>
              </div>
            </div>
          )}

          <div style={{ position:"relative", marginBottom:16, maxWidth:320 }}>
            <span style={{ position:"absolute", left:11, top:"50%", transform:"translateY(-50%)", color:C.text3 }}>{Ic.search}</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" style={{ ...inp, paddingLeft:34 }} />
          </div>

          <div style={{ ...card, overflow:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr>
                  {[["condition","Cond."],["listingNum","Year"],["bikeModel","Model"],["internalSerial","Internal Serial"],["purchasePrice","Price"],["driveFolderId","Drive Folder"]].map(([f,l])=>(
                    <th key={f} style={thStyle()} onClick={()=>toggleSort(f)}>{l}{sortIcon(f)}</th>
                  ))}
                  <th style={{...thStyle(),cursor:"default"}}>Notes</th>
                  <th style={{...thStyle(),cursor:"default"}}>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length===0 && <tr><td colSpan={8} style={{ padding:40, textAlign:"center", color:C.text3 }}>No bikes yet.</td></tr>}
                {filtered.map((bike,i) => {
                  const isEditing = editingId===bike.id;
                  return (
                    <tr key={bike.id} style={{ borderTop:`1px solid ${C.border}`, background:i%2===0?C.white:C.bg }}>
                      <td style={{ padding:"12px 14px", fontFamily:C.mono, fontWeight:600, color:C.text }}>{isEditing?<select value={editData.condition} onChange={e=>setEditData({...editData,condition:e.target.value})} style={{padding:"4px 8px",fontSize:12,border:`1px solid ${C.border2}`,borderRadius:4}}><option value="U">U</option><option value="N">N</option></select>:<span style={{background:bike.condition==="N"?C.blueL:C.accentL,color:bike.condition==="N"?C.blue:C.accentD,padding:"2px 8px",borderRadius:4,fontSize:11,fontWeight:700}}>{bike.condition||"U"}</span>}</td>
                      <td style={{ padding:"12px 14px", fontFamily:C.mono, fontWeight:600 }}>{isEditing?<FI value={editData.listingNum} onChange={e=>setEditData({...editData,listingNum:e.target.value})} style={{padding:"4px 8px",fontSize:12,width:80}} />:bike.listingNum}</td>
                      <td style={{ padding:"12px 14px", fontWeight:600 }}>{isEditing?<FI value={editData.bikeModel} onChange={e=>setEditData({...editData,bikeModel:e.target.value})} style={{padding:"4px 8px",fontSize:12,width:120}} />:bike.bikeModel}</td>
                      <td style={{ padding:"12px 14px", color:C.text2 }}>{isEditing?<FI value={editData.internalSerial} onChange={e=>setEditData({...editData,internalSerial:e.target.value})} style={{padding:"4px 8px",fontSize:12,width:80}} />:(bike.internalSerial||"—")}</td>
                      <td style={{ padding:"12px 14px", fontWeight:600 }}>{isEditing?<FI type="number" value={editData.purchasePrice} onChange={e=>setEditData({...editData,purchasePrice:e.target.value})} style={{padding:"4px 8px",fontSize:12,width:100}} />:bike.purchasePrice?`$${bike.purchasePrice}`:"—"}</td>
                      <td style={{ padding:"12px 14px" }}>{isEditing?<FI value={editData.driveFolderId} onChange={e=>setEditData({...editData,driveFolderId:e.target.value})} style={{padding:"4px 8px",fontSize:11,width:200}} />:bike.driveFolderId?<a href={`https://drive.google.com/drive/folders/${bike.driveFolderId}`} target="_blank" rel="noopener noreferrer" style={{ color:C.accent, fontSize:12, textDecoration:"none", fontWeight:500 }}>{Ic.link} Open</a>:<span style={{ color:C.text3, fontSize:12 }}>Not linked</span>}</td>
                      <td style={{ padding:"12px 14px", color:C.text2 }}>{isEditing?<FI value={editData.notes} onChange={e=>setEditData({...editData,notes:e.target.value})} style={{padding:"4px 8px",fontSize:12}} />:(bike.notes||"—")}</td>
                      <td style={{ padding:"12px 14px" }}>
                        {isEditing?(
                          <div style={{ display:"flex", gap:6 }}>
                            <button onClick={saveEdit} style={{ ...btn, background:C.accent, color:"#fff", padding:"5px 12px", fontSize:12 }}>{Ic.check} Save</button>
                            <button onClick={()=>{setEditingId(null);setEditData(null);}} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"5px 10px", fontSize:12 }}>Cancel</button>
                          </div>
                        ):(
                          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                            <button onClick={()=>onChecklist&&onChecklist(bike)} style={{ ...btn, background:C.accentL, color:C.accentD, border:`1px solid ${C.accent}33`, padding:"5px 10px", fontSize:12, fontWeight:600 }}>☑ Parts Checklist</button>
                            <button onClick={()=>{setEditingId(bike.id);setEditData({...bike});}} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"5px 10px", fontSize:12 }}>Edit</button>
                            <button onClick={()=>deleteBike(bike)} style={{ ...btn, background:C.redL, color:C.red, padding:"5px 10px", fontSize:12 }}>{Ic.trash}</button>
                          </div>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // ─── LIGHTBOX ──────────────────────────────────────────────────────────────
    const Lightbox = ({ photos, startIndex, onClose }) => {
      const [idx, setIdx] = useState(startIndex || 0);
      const photo = photos[idx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape") onClose();
          if (e.key === "ArrowRight") setIdx(i => Math.min(i+1, photos.length-1));
          if (e.key === "ArrowLeft")  setIdx(i => Math.max(i-1, 0));
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [photos.length]);

      if (!photo) return null;
      return (
        <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", zIndex:1000, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
          <div onClick={e=>e.stopPropagation()} style={{ position:"relative", maxWidth:"90vw", maxHeight:"85vh" }}>
            <img src={photo.fullUrl ? photo.fullUrl.replace("/view","") + "?usp=sharing" : photo.url} alt={photo.name}
              style={{ maxWidth:"90vw", maxHeight:"80vh", objectFit:"contain", borderRadius:8, boxShadow:"0 8px 40px rgba(0,0,0,0.6)" }}
              onError={e=>{ e.target.src = photo.url; }} />
          </div>
          <div style={{ marginTop:12, color:"rgba(255,255,255,0.7)", fontSize:12, textAlign:"center" }}>
            {photo.name} · {idx+1} / {photos.length}
            <span style={{ marginLeft:16, opacity:0.5 }}>← → to navigate · ESC to close</span>
          </div>
          {idx > 0 && <button onClick={e=>{e.stopPropagation();setIdx(i=>i-1);}} style={{ position:"fixed", left:20, top:"50%", transform:"translateY(-50%)", background:"rgba(255,255,255,0.1)", border:"1px solid rgba(255,255,255,0.2)", color:"#fff", borderRadius:8, padding:"12px 16px", cursor:"pointer", fontSize:20 }}>‹</button>}
          {idx < photos.length-1 && <button onClick={e=>{e.stopPropagation();setIdx(i=>i+1);}} style={{ position:"fixed", right:20, top:"50%", transform:"translateY(-50%)", background:"rgba(255,255,255,0.1)", border:"1px solid rgba(255,255,255,0.2)", color:"#fff", borderRadius:8, padding:"12px 16px", cursor:"pointer", fontSize:20 }}>›</button>}
          <button onClick={onClose} style={{ position:"fixed", top:16, right:16, background:"rgba(255,255,255,0.1)", border:"1px solid rgba(255,255,255,0.2)", color:"#fff", borderRadius:6, padding:"6px 14px", cursor:"pointer", fontSize:13 }}>✕ Close</button>
        </div>
      );
    };

    // ─── PART IMAGES PAGE ──────────────────────────────────────────────────────
    const PartImagesPage = ({ bikes, flash, masterParts, partsLoading, loadMasterParts, getBikeParts, addTempPart, clearTempParts, getNextPartNum, onChecklist }) => {
      const [selectedBike, setSelectedBike]     = useState(null);
      const [photos, setPhotos]                 = useState([]);
      const [subfolders, setSubfolders]         = useState([]);
      const [loadingFolder, setLoadingFolder]   = useState(false);
      const [selectedPhotos, setSelectedPhotos] = useState(new Set());
      const [showPartModal, setShowPartModal]   = useState(false);
      const [partSearch, setPartSearch]         = useState("");
      // New part modal state
      const [showNewPartModal, setShowNewPartModal] = useState(false);
      const [newPartName, setNewPartName]           = useState("");
      const [newPartNum, setNewPartNum]             = useState("");
      const [newPartRatio, setNewPartRatio]         = useState("0.001");
      const [newPartType, setNewPartType]           = useState("temporary"); // "temporary" | "permanent"
      const [newPartCategory, setNewPartCategory]   = useState("");
      const [savingNewPart, setSavingNewPart]       = useState(false);
      const [viewingFolder, setViewingFolder]   = useState(null);
      const [saving, setSaving]                 = useState(false);
      const [hasChanges, setHasChanges]         = useState(false);
      const [sourceFolderInput, setSourceFolderInput] = useState("");
      const [sourceFolderId, setSourceFolderId]       = useState("");
      const [loadingSource, setLoadingSource]         = useState(false);
      const [sortOrder, setSortOrder]           = useState("az");
      const [showSortMenu, setShowSortMenu]     = useState(false);
      const [editingNoteId, setEditingNoteId]   = useState(null);
      const [noteText, setNoteText]             = useState("");
      const [folderSearch, setFolderSearch]     = useState("");
      const [modalPartNum, setModalPartNum]     = useState(null);
      const [modalLocation, setModalLocation]   = useState("");
      const [checklistConfirmed, setChecklistConfirmed] = useState([]); // confirmed part codes for this bike
      const [lightboxPhotos, setLightboxPhotos] = useState(null);
      const [lightboxIdx, setLightboxIdx]       = useState(0);
      // Drag select
      const [isDragging, setIsDragging]         = useState(false);
      const [dragAnchor, setDragAnchor]         = useState(null);
      const [dragBox, setDragBox]               = useState(null);
      // Floating assign bar
      const gridRef   = useRef(null);
      const photoRefs = useRef({});
      const focusedPhoto = useRef(null);
      const [hoveredPhoto, setHoveredPhoto] = useState(null);

      const storageKey    = id => `hr_src_${id}`;
      const photoCacheKey = (id, fid) => `hr_photos_${id}_${fid}`;
      const sortKey       = id => `hr_sort_${id}`;

      const extractFolderId = (input) => {
        const t=(input||"").trim();
        const m=t.match(/\/folders\/([a-zA-Z0-9_-]+)/); if(m) return m[1];
        const m2=t.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m2) return m2[1];
        if(/^[a-zA-Z0-9_-]{10,}$/.test(t)) return t;
        return null;
      };

      const applySort = (arr, order) => {
        const a = [...arr];
        if (order==="az") return a.sort((x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}));
        if (order==="za") return a.sort((x,y)=>y.name.localeCompare(x.name,undefined,{numeric:true}));
        return a;
      };

      const loadSourceFolder = async (folderId, bikeId, inputVal) => {
        if (!folderId) { flash("⚠ Invalid folder URL or ID"); return; }
        setLoadingSource(true); setPhotos([]); setSelectedPhotos(new Set());
        try {
          const d = await callApi({ action:"drive_folder_contents", folderId });
          const sorted = applySort(d.photos||[], sortOrder);
          setPhotos(sorted); setSourceFolderId(folderId);
          try { localStorage.setItem(photoCacheKey(bikeId,folderId), JSON.stringify(sorted)); } catch(e){}
          try { localStorage.setItem(storageKey(bikeId), JSON.stringify({folderId, input:inputVal||folderId})); } catch(e){}
          flash(`✓ Loaded ${sorted.length} photo${sorted.length!==1?"s":""} · sorted ${sortOrder==="az"?"A–Z":"Z–A"}`);
        } catch(e) { flash("⚠ Could not load folder: "+e.message); }
        setLoadingSource(false);
      };

      const handleLoadClick = () => loadSourceFolder(extractFolderId(sourceFolderInput), selectedBike?.id, sourceFolderInput);

      useEffect(() => {
        if (!selectedBike?.driveFolderId) return;
        setLoadingFolder(true);
        setSubfolders([]); setPhotos([]); setViewingFolder(null); setHasChanges(false); setSelectedPhotos(new Set()); setSourceFolderId(""); setEditingNoteId(null);
        // Load confirmed checklist parts for this bike (for modal filtering)
        const bikeImgKey=selectedBike.internalSerial||(selectedBike.condition||"U")+(selectedBike.listingNum||"")+"-"+(selectedBike.bikeModel||"");
        callApi({action:"checklist_read", bikeSerial:bikeImgKey}).then(d=>{
          const confirmed = (d.items||[]).filter(i=>i.onBike===true||String(i.onBike).toUpperCase()==="TRUE").map(i=>String(i.partNum));
          setChecklistConfirmed(confirmed);
        }).catch(()=>{ setChecklistConfirmed([]); });
        try {
          const saved = localStorage.getItem(storageKey(selectedBike.id));
          const savedSort = localStorage.getItem(sortKey(selectedBike.id));
          if (savedSort) setSortOrder(savedSort);
          if (saved) {
            const { folderId, input } = JSON.parse(saved);
            setSourceFolderInput(input||folderId||"");
            const cached = localStorage.getItem(photoCacheKey(selectedBike.id, folderId));
            if (cached) { setPhotos(applySort(JSON.parse(cached), savedSort||sortOrder)); setSourceFolderId(folderId); }
          } else { setSourceFolderInput(""); }
        } catch(e) { setSourceFolderInput(""); }
        callApi({ action:"drive_folder_contents", folderId: selectedBike.driveFolderId })
          .then(d => setSubfolders((d.subfolders||[]).map(sf=>({...sf,photos:[],isNew:false}))))
          .catch(()=>flash("⚠ Could not load bike folder"))
          .finally(()=>setLoadingFolder(false));
      }, [selectedBike]);

      // Re-sort photos when sort order changes
      const changeSort = (order) => {
        setSortOrder(order); setShowSortMenu(false);
        setPhotos(prev => applySort(prev, order));
        try { localStorage.setItem(sortKey(selectedBike?.id), order); } catch(e){}
      };

      // ── Drag select ───────────────────────────────────────────────────────
      const getRelPos = (e) => { const r=gridRef.current?.getBoundingClientRect(); if(!r) return {x:0,y:0}; return {x:e.clientX-r.left, y:e.clientY-r.top}; };
      const computeBox = (a,b) => ({ x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x), h:Math.abs(a.y-b.y) });
      const hitTest = (box) => {
        const gr=gridRef.current?.getBoundingClientRect(); if(!gr) return new Set();
        const sel=new Set();
        Object.entries(photoRefs.current).forEach(([id,el])=>{
          if(!el) return; const pr=el.getBoundingClientRect();
          const px=pr.left-gr.left, py=pr.top-gr.top;
          if(px<box.x+box.w && px+pr.width>box.x && py<box.y+box.h && py+pr.height>box.y) sel.add(id);
        });
        return sel;
      };
      const onGridMouseDown = (e) => {
        if(e.button!==0) return;
        // Don't start drag if clicking a photo directly
        if(e.target.tagName==="IMG" || e.target.closest("[data-photo]")) return;
        e.preventDefault();
        const pos=getRelPos(e); setIsDragging(true); setDragAnchor(pos); setDragBox({x:pos.x,y:pos.y,w:0,h:0});
      };
      useEffect(()=>{
        if(!isDragging) return;
        const onMove=(e)=>{ const cur=getRelPos(e); const box=computeBox(dragAnchor,cur); setDragBox(box); if(box.w>5||box.h>5) { const hit=hitTest(box); if(hit.size>0) setSelectedPhotos(prev=>{ const n=new Set(prev); hit.forEach(id=>n.add(id)); return n; }); } };
        const onUp=()=>{ setIsDragging(false); setDragAnchor(null); setDragBox(null); };
        window.addEventListener("mousemove",onMove); window.addEventListener("mouseup",onUp);
        return ()=>{ window.removeEventListener("mousemove",onMove); window.removeEventListener("mouseup",onUp); };
      },[isDragging,dragAnchor]);

      // ── Keyboard nav + shortcuts ──────────────────────────────────────────
      useEffect(()=>{
        const onKey=(e)=>{
          // Don't fire when typing in an input/textarea
          const tag = document.activeElement?.tagName?.toLowerCase();
          const isTyping = tag==="input"||tag==="textarea"||tag==="select";

          // Cmd+Enter / Ctrl+Enter — open Add Part modal when photos selected
          if((e.metaKey||e.ctrlKey) && e.key==="Enter") {
            if(!isTyping && selectedPhotos.size>0 && !showPartModal && !showNewPartModal) {
              e.preventDefault();
              setShowPartModal(true); setPartSearch("");
            }
            return;
          }

          // Escape — close modals / deselect
          if(e.key==="Escape") {
            if(lightboxPhotos) { setLightboxPhotos(null); return; }
            if(showNewPartModal) { setShowNewPartModal(false); return; }
            if(showPartModal) { setShowPartModal(false); setPartSearch(""); return; }
            if(editingNoteId) { setEditingNoteId(null); return; }
            if(selectedPhotos.size>0) { setSelectedPhotos(new Set()); return; }
            return;
          }

          // Arrow keys + Space — only when not typing and photo grid is active
          if(isTyping || showPartModal || showNewPartModal || editingNoteId || lightboxPhotos) return;
          if(!photos.length) return;

          const isArrow = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key);
          const isSpace = e.key===" ";
          if(!isArrow && !isSpace) return;

          e.preventDefault();

          const cur = focusedPhoto.current || photos[0]?.id;
          const curIdx = photos.findIndex(p=>p.id===cur);
          const safeIdx = curIdx === -1 ? 0 : curIdx;

          // Calculate columns from grid width
          const gridWidth = gridRef.current?.offsetWidth || 600;
          const itemWidth = 130; // ~120px + gap
          const cols = Math.max(1, Math.floor(gridWidth / itemWidth));

          if(isSpace) {
            if(cur) {
              setSelectedPhotos(prev=>{ const n=new Set(prev); n.has(cur)?n.delete(cur):n.add(cur); return n; });
            }
            return;
          }

          let next = safeIdx;
          if(e.key==="ArrowRight") next = Math.min(safeIdx+1, photos.length-1);
          if(e.key==="ArrowLeft")  next = Math.max(safeIdx-1, 0);
          if(e.key==="ArrowDown")  next = Math.min(safeIdx+cols, photos.length-1);
          if(e.key==="ArrowUp")    next = Math.max(safeIdx-cols, 0);

          if(next !== safeIdx && photos[next]) {
            focusedPhoto.current = photos[next].id;
            // Force re-render to show new focused state
            setSelectedPhotos(prev => new Set(prev));
            photoRefs.current[photos[next].id]?.scrollIntoView({block:"nearest", behavior:"smooth"});
          }
        };
        window.addEventListener("keydown", onKey);
        return ()=>window.removeEventListener("keydown", onKey);
      },[photos, showPartModal, showNewPartModal, editingNoteId, lightboxPhotos, selectedPhotos]);

      const togglePhoto = (id) => {
        focusedPhoto.current=id;
        setSelectedPhotos(prev=>{ const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; });
      };

      const selectAll = () => setSelectedPhotos(new Set(photos.map(p=>p.id)));
      const deselectAll = () => setSelectedPhotos(new Set());

      // ── Part modal ────────────────────────────────────────────────────────
      const openPartModal = () => { setModalPartNum(null); setModalLocation(""); setShowPartModal(true); setPartSearch(""); };
      const selectPartInModal = (partNum) => {
        if(EXCEPTION_PARTS.has(partNum)) {
          // Check if location already in checklist
          const allPartsForBike = getBikeParts && selectedBike ? getBikeParts(selectedBike.id) : masterParts;
          // Look for location in temp/checklist data via localStorage
          const tempKey = `hr_temp_parts_${selectedBike?.id||''}`;
          let checklistLoc = "";
          try {
            const stored = localStorage.getItem(`hr_checklist_locs_${selectedBike?.id||''}`)
            if(stored) { const locs = JSON.parse(stored); checklistLoc = locs[String(partNum)]||""; }
          } catch(e) {}
          if(checklistLoc) {
            // Already have location — skip modal
            confirmAddPart(partNum, checklistLoc, null);
          } else {
            setModalPartNum(partNum); setModalLocation("");
          }
        } else {
          confirmAddPart(partNum,"",null);
        }
      };
      const confirmAddPart = (partNum, location, customName) => {
        const allParts = getBikeParts ? getBikeParts(selectedBike?.id||'') : masterParts;
        const part = allParts.find(p=>String(p.num)===String(partNum)) || (customName ? {name:customName} : null); if(!part) return;
        const folderName=`${String(partNum)} - ${part.name}`;
        if(subfolders.some(sf=>sf.name===folderName||sf.name===part.name)) { flash(`⚠ ${part.name} folder already exists`); return; }
        const tempId="new-"+Date.now()+"-"+partNum;
        const photoIds=Array.from(selectedPhotos);
        const assignedPhotos=photos.filter(p=>photoIds.includes(p.id));
        setSubfolders(prev=>[...prev,{id:null,tempId,name:folderName,partNum,photoCount:0,photos:assignedPhotos,isNew:true,location}]);
        if(assignedPhotos.length>0) { setPhotos(prev=>prev.filter(p=>!photoIds.includes(p.id))); setSelectedPhotos(new Set()); flash(`✓ ${folderName} created with ${assignedPhotos.length} photo${assignedPhotos.length!==1?"s":""} assigned`); }
        else flash(`✓ ${folderName} added`);
        setHasChanges(true); setShowPartModal(false); setModalPartNum(null); setPartSearch("");
      };

      // Parts for Part Images modal: ALL parts, sorted by code, checklist confirmed highlighted
      const allPartsForModal = getBikeParts && selectedBike ? getBikeParts(selectedBike.id) : masterParts;
      const filteredParts = allPartsForModal
        .filter(p=>{ if(!partSearch) return true; const q=partSearch.toLowerCase(); return p.name.toLowerCase().includes(q)||String(p.num).toLowerCase().includes(q); })
        .sort((a,b)=>String(a.num).localeCompare(String(b.num)));

      // ── Assign photos ─────────────────────────────────────────────────────
      const assignPhotosToFolder = (folder) => {
        if(selectedPhotos.size===0) { flash("⚠ Select photos first"); return; }
        const photoIds=Array.from(selectedPhotos);
        const moved=photos.filter(p=>photoIds.includes(p.id));
        setSubfolders(prev=>prev.map(sf=>{ if((sf.id&&sf.id===folder.id)||(sf.tempId&&sf.tempId===folder.tempId)) return {...sf,photos:[...sf.photos,...moved.filter(mp=>!sf.photos.find(x=>x.id===mp.id))]}; return sf; }));
        setPhotos(prev=>prev.filter(p=>!photoIds.includes(p.id)));
        setSelectedPhotos(new Set()); setHasChanges(true); setShowAssignDropdown(false);
        flash(`✓ ${moved.length} photo${moved.length!==1?"s":""} assigned to ${folder.name}`);
      };

      // ── Unassign photos back to source Drive folder ───────────────────────
      const unassignSelectedToSource = async () => {
        if(selectedPhotos.size===0) { flash("⚠ Select photos first"); return; }
        if(!sourceFolderId) { flash("⚠ Load a source folder first"); return; }
        const photoIds=Array.from(selectedPhotos);
        // These are unassigned photos already in the source folder — nothing to move in Drive
        // Just remove from local pool (they stay in source folder)
        setPhotos(prev=>prev.filter(p=>!photoIds.includes(p.id)));
        setSelectedPhotos(new Set());
        flash(`✓ ${photoIds.length} photo${photoIds.length!==1?"s":""} removed from view`);
      };

      // ── Unassign from part folder back to source ──────────────────────────
      const unassignPhotoFromFolder = async (photo, folder) => {
        setSubfolders(prev=>prev.map(sf=>{ if((sf.id&&sf.id===folder.id)||(sf.tempId&&sf.tempId===folder.tempId)) return {...sf,photos:sf.photos.filter(p=>p.id!==photo.id)}; return sf; }));
        // Move back to source folder in Drive if folder exists
        if(folder.id && !folder.isNew && sourceFolderId) {
          try { await callApi({action:"drive_unassign_photos", fileIds:[photo.id], partFolderId:folder.id, bikeFolderId:sourceFolderId}); flash("✓ Photo returned to source folder"); }
          catch(e) { flash("⚠ Could not move in Drive: "+e.message); }
        } else { flash("✓ Photo unassigned"); }
        setHasChanges(true);
        if(viewingFolder) setViewingFolder(vf=>({...vf,photos:(vf.photos||[]).filter(p=>p.id!==photo.id)}));
      };

      // ── Notes ─────────────────────────────────────────────────────────────
      const startEditNote = (sf) => { const m=sf.name.match(/\(([^)]*)\)\s*$/); setNoteText(m?m[1]:""); setEditingNoteId(sf.id||sf.tempId); };
      const saveNote = async (sf) => {
        const base=sf.name.replace(/\s*\(.*\)\s*$/,"").trim();
        const newName=noteText.trim()?`${base} (${noteText.trim()})`:base;
        setSubfolders(prev=>prev.map(s=>{ if((s.id&&s.id===sf.id)||(s.tempId&&s.tempId===sf.tempId)) return {...s,name:newName}; return s; }));
        if(sf.id&&!sf.isNew) { try { await callApi({action:"drive_rename_folder",folderId:sf.id,newName}); flash("✓ Note saved"); } catch(e) { flash("⚠ Rename failed"); } }
        else flash("✓ Note saved");
        setEditingNoteId(null); setHasChanges(true);
      };

      // ── Delete folder ─────────────────────────────────────────────────────
      const deleteFolder = async (sf) => {
        if(!window.confirm(`Delete "${sf.name}"? Photos will be moved back to source folder.`)) return;
        const pending=sf.photos||[];
        if(pending.length>0) setPhotos(prev=>applySort([...prev,...pending],sortOrder));
        setSubfolders(prev=>prev.filter(s=>(s.id||s.tempId)!==(sf.id||sf.tempId)));
        setHasChanges(true);
        if(sf.id&&!sf.isNew) { try { await callApi({action:"drive_delete_part_folder",partFolderId:sf.id,bikeFolderId:selectedBike.driveFolderId}); flash("✓ Folder deleted"); } catch(e) { flash("⚠ Drive delete failed: "+e.message); } }
        else flash("✓ Folder removed");
        if(viewingFolder&&(viewingFolder.id===sf.id||viewingFolder.tempId===sf.tempId)) setViewingFolder(null);
      };

      // ── Save all ──────────────────────────────────────────────────────────
      const saveAllChanges = async () => {
        if(!selectedBike?.driveFolderId) {
          flash("⚠ No Drive Folder ID on this bike — add it in Purchase Ledger first");
          return;
        }
        if(!sourceFolderId) {
          flash("⚠ No source folder loaded — paste a Drive folder URL above and click Load Photos first");
          return;
        }
        // Must have a source folder to move files from
        const effectiveSourceId = sourceFolderId || selectedBike.driveFolderId;
        setSaving(true); flash("Saving changes to Drive…");
        try {
          const newFolders = subfolders.filter(sf => sf.isNew);
          // Only include moves for folders that have pending photos
          const moves = subfolders
            .filter(sf => sf.photos && sf.photos.length > 0)
            .flatMap(sf => sf.photos.map(p => ({
              fileId: p.id,
              fromFolderId: effectiveSourceId,
              targetTempId: sf.isNew ? sf.tempId : null,
              targetFolderId: sf.isNew ? null : sf.id,
            })));

          if(newFolders.length === 0 && moves.length === 0) {
            flash("⚠ Nothing to save — no new folders or assigned photos");
            setSaving(false); return;
          }

          const res = await callApi({
            action: "drive_batch_save_with_source",
            bikeFolderId: selectedBike.driveFolderId,
            sourceFolderId: effectiveSourceId,
            newFolders: newFolders.map(sf => ({ tempId: sf.tempId, partName: sf.name })),
            moves,
            unassigns: [],
            deleteFolders: [],
          });

          if(res.error) throw new Error(res.error);

          const errors = res.results?.errors || [];
          if(errors.length > 0) {
            console.error("Drive save errors:", JSON.stringify(errors));
            flash(`⚠ Saved with ${errors.length} error(s): ${errors[0].error||errors[0]}`);
          } else {
            if(res.results?.createdFolders) {
              setSubfolders(prev => prev.map(sf => {
                if(sf.isNew && res.results.createdFolders[sf.tempId]) {
                  return { ...sf, id: res.results.createdFolders[sf.tempId].id, isNew: false, tempId: null, photos: [] };
                }
                return { ...sf, photos: [] };
              }));
            }
            setHasChanges(false);
            flash(`✓ All changes saved to Drive (${newFolders.length} folder${newFolders.length!==1?"s":""} created, ${moves.length} photo${moves.length!==1?"s":""} moved)`);
          }
        } catch(e) { console.error("saveAllChanges error:", e); flash("⚠ Save failed: " + e.message); }
        setSaving(false);
      };

      const openFolderView = async (sf) => {
        if(!sf.id) { setViewingFolder({...sf}); return; }
        try { const d=await callApi({action:"drive_folder_contents",folderId:sf.id}); setViewingFolder({...sf,photos:d.photos||[]}); }
        catch { setViewingFolder(sf); }
      };

      const sortLabels = { az:"Name A–Z", za:"Name Z–A" };

      return (
        <div style={{ animation:"fadeIn 0.2s ease" }}>
          {lightboxPhotos && <Lightbox photos={lightboxPhotos} startIndex={lightboxIdx} onClose={()=>setLightboxPhotos(null)} />}

          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
            <div>
              <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>Part Images</h1>
              <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>Load photos from a Drive folder, assign to part folders</p>
            </div>
            {selectedBike&&onChecklist&&(
              <button onClick={()=>onChecklist(selectedBike)} style={{ ...btn, background:C.accentL, color:C.accentD, border:`1px solid ${C.accent}33`, fontSize:12 }}>
                ☑ Edit Checklist for {selectedBike.bikeModel}
              </button>
            )}
          </div>

          {/* Bike + source folder */}
          <div style={{ ...card, padding:20, marginBottom:20 }}>
            <div style={{ display:"grid", gridTemplateColumns:"280px 1fr auto", gap:16, alignItems:"flex-end" }}>
              <div>
                <label style={lbl}>Select Bike</label>
                <select value={selectedBike?.id||""} onChange={e=>{ const b=bikes.find(bk=>bk.id===e.target.value); setSelectedBike(b||null); setPhotos([]); setSourceFolderId(""); setSelectedPhotos(new Set()); }} style={{ ...inp }}>
                  <option value="">— choose a bike —</option>

                        return imgUrl ? (
                          <a href={`https://lens.google.com/uploadbyurl?url=${encodeURIComponent(imgUrl)}`} target="_blank" rel="noopener noreferrer"
                            style={{ ...btn, background:"#4285f4", color:"#fff", padding:"5px 12px", fontSize:12, textDecoration:"none" }}

                      </button>
                      <button onClick={()=>setNewPartType("permanent")} style={{ flex:1, padding:"10px", background:newPartType==="permanent"?C.accent:"none", color:newPartType==="permanent"?"#fff":C.text2, border:"none", borderLeft:`1px solid ${C.border}`, cursor:"pointer", fontFamily:"inherit", fontSize:13, fontWeight:600, transition:"all 0.15s" }}>
                        Permanent
                      </button>
                    </div>
                    <div style={{ fontSize:11, color:C.text3, marginTop:6 }}>
                      {newPartType==="temporary" ? "Saved to this bike only · stored locally · not added to master list" : "Added to master Parts Bible in Google Sheet · available for all future bikes"}
                    </div>
                  </div>
                  {/* Part Name */}
                  <div style={{ marginBottom:14 }}>
                    <label style={lbl}>Part Name *</label>
                    <FI autoFocus value={newPartName} onChange={e=>setNewPartName(e.target.value)} placeholder="e.g. Oil Cooler" />
                  </div>
                  {/* Category + Part Code */}
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:14 }}>
                    <div>
                      <label style={lbl}>Category *</label>
                      <select value={newPartCategory} onChange={e=>{
                        setNewPartCategory(e.target.value);
                        // Auto-assign next code for this category
                        const allP = [...masterParts];
                        const catP = allP.filter(p=>String(p.num).startsWith(e.target.value+"-"));
                        const nums = catP.map(p=>{ const m=String(p.num).match(/(\d+)$/); return m?parseInt(m[1]):0; });
                        const next = nums.length>0?Math.max(...nums)+1:1;
                        setNewPartNum(e.target.value+"-"+String(next).padStart(2,"0"));
                      }} style={{ ...inp }}>
                        <option value="">— select —</option>
                        {[["EX","Exhaust"],["EN","Engine"],["SS","Suspension"],["WL","Wheels"],["FR","Frame"],["OS","Outer Systems"]].map(([c,l])=><option key={c} value={c}>{c} — {l}</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={lbl}>Part Code *</label>
                      <FI value={newPartNum} onChange={e=>setNewPartNum(e.target.value)} placeholder="e.g. OS-65" style={{ fontFamily:C.mono }} />
                    </div>
                  </div>
                  {/* Ratio */}
                  <div style={{ marginBottom:14 }}>
                    <label style={lbl}>Cost Ratio (optional — e.g. 0.01 = 1%)</label>

                      const ratio = parseFloat(newPartRatio) || 0.001;
                      const newPart = { num, name:newPartName.trim(), ratio, category:newPartCategory, isTemp:newPartType==="temporary" };
                      setSavingNewPart(true);
                      if(newPartType==="permanent") {
                        // Save to Google Sheet
                        try {
                          const updated = [...masterParts, newPart];
                          await callApi({ action:"parts_master_write", parts:updated, groups:{} });
                          if(loadMasterParts) loadMasterParts();
                          flash("✓ Part added to master list permanently");
                        } catch(e) { flash("⚠ Could not save to sheet: "+e.message); }
                      } else {
                        // Save to localStorage for this bike
                        if(addTempPart && selectedBike) addTempPart(selectedBike.id, newPart);
                        flash(`✓ ${newPart.name} added temporarily for ${selectedBike?.id||"this bike"}`);
                      }
                      setSavingNewPart(false);
                      setShowNewPartModal(false);
                      // Auto-add as folder
                      const paddedNum = String(num).padStart(2,"0");
                      const folderName = `${paddedNum} - ${newPart.name}`;
                      const tempId = "new-"+Date.now()+"-"+num;
                      const photoIds = Array.from(selectedPhotos);
                      const assignedPhotos = photos.filter(p=>photoIds.includes(p.id));
                      setSubfolders(prev=>[...prev,{id:null,tempId,name:folderName,partNum:num,photoCount:0,photos:assignedPhotos,isNew:true}]);

                      setShowPartModal(false); setPartSearch("");

                    <button onClick={()=>setShowNewPartModal(false)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"9px 16px" }}>Cancel</button>

                {modalPartNum?(
