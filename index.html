                  <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}` }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:C.text }}>Saved SKUs — {selectedBike.condition}{selectedBike.listingNum} {selectedBike.bikeModel}</div>
                      <div style={{ display:"flex", gap:6 }}>
                        <button onClick={exportLabels} style={{ ...btn, background:"#1F3864", color:"#fff", padding:"4px 12px", fontSize:11 }}>
                          ⬇ Export Labels (.docx)
                        </button>
                        <button onClick={refreshCosts} disabled={saving} style={{ ...btn, background:C.orangeL, color:C.orange, border:`1px solid ${C.orange}33`, padding:"4px 10px", fontSize:11 }}>
                          {saving?Ic.spin:"↻"} Refresh
                        </button>
                      </div>
                    </div>
                    <div style={{ position:"relative" }}>
                      <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)", color:C.text3 }}>{Ic.search}</span>
                      <input value={skuSearch} onChange={e=>setSkuSearch(e.target.value)} placeholder="Search SKUs…" style={{ ...inp, paddingLeft:30, fontSize:12, padding:"6px 12px 6px 30px" }} />
                    </div>
                  </div>
                  <div style={{ maxHeight:360, overflowY:"auto" }}>
                    {loadingSaved?<Spinner />:filteredSaved.map((item,i)=>{
                      const isEditing=editingSkuIdx===i;
                      return (
                        <div key={i} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.white:C.bg }}>
                          {isEditing?(
                            <div style={{ padding:"10px 16px" }}>
                              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                                <div><label style={{ ...lbl, fontSize:9 }}>SKU</label><FI value={editSkuData.sku} onChange={e=>setEditSkuData({...editSkuData,sku:e.target.value})} style={{ fontSize:11, padding:"4px 8px", fontFamily:C.mono }} /></div>
                                <div><label style={{ ...lbl, fontSize:9 }}>COGS</label><FI type="number" value={editSkuData.cogs} onChange={e=>setEditSkuData({...editSkuData,cogs:parseFloat(e.target.value)||0})} style={{ fontSize:11, padding:"4px 8px" }} /></div>
                                <div><label style={{ ...lbl, fontSize:9 }}>Part Name</label><FI value={editSkuData.partName} onChange={e=>setEditSkuData({...editSkuData,partName:e.target.value})} style={{ fontSize:11, padding:"4px 8px" }} /></div>
                                <div><label style={{ ...lbl, fontSize:9 }}>Location</label><FI value={editSkuData.shelfLocation||""} onChange={e=>setEditSkuData({...editSkuData,shelfLocation:e.target.value})} style={{ fontSize:11, padding:"4px 8px" }} /></div>
                              </div>
                              <div style={{ display:"flex", gap:6 }}>
                                <button onClick={saveSkuEdit} style={{ ...btn, background:C.accent, color:"#fff", padding:"4px 12px", fontSize:11 }}>{Ic.check} Save</button>
                                <button onClick={()=>{setEditingSkuIdx(null);setEditSkuData(null);}} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"4px 10px", fontSize:11 }}>Cancel</button>
                              </div>
                            </div>
                          ):(
                            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"9px 16px" }}>
                              <div>
                                <div style={{ fontFamily:C.mono, fontSize:11, fontWeight:600, color:C.text }}>{item.sku}</div>
                                <div style={{ fontSize:11, color:C.text3, marginTop:1 }}>{item.partName}</div>
                              </div>
                              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                                <span style={{ fontSize:12, fontWeight:600, color:C.accent }}>${item.cogs||item.cost||0}</span>
                                <button onClick={()=>{ navigator.clipboard.writeText(item.sku); flash("✓ Copied"); }} style={{ ...btn, padding:"2px 7px", fontSize:10, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>{Ic.copy}</button>
                                <button onClick={()=>startEditSku(item,i)} style={{ ...btn, padding:"2px 7px", fontSize:10, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>Edit</button>
                                <button onClick={()=>deleteSkuRow(item,i)} style={{ ...btn, padding:"2px 7px", fontSize:10, background:C.redL, color:C.red }}>{Ic.trash}</button>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Always show saved SKUs panel when bike selected */}
              {selectedBike&&savedSkus.length>0&&generatedSkus&&(
                <div style={{ ...card, overflow:"hidden", marginTop:0 }}>
                  <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                    <div style={{ fontSize:13, fontWeight:600, color:C.text }}>Saved SKUs ({savedSkus.length})</div>
                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={exportLabels} style={{ ...btn, background:"#1F3864", color:"#fff", padding:"4px 10px", fontSize:11 }}>⬇ Export</button>
                      <button onClick={refreshCosts} disabled={saving} style={{ ...btn, background:C.orangeL, color:C.orange, border:`1px solid ${C.orange}33`, padding:"4px 10px", fontSize:11 }}>
                        {saving?Ic.spin:"↻"} Refresh
                      </button>
                    </div>
                  </div>
                  <div style={{ maxHeight:200, overflowY:"auto" }}>
                    {filteredSaved.map((item,i)=>(
                      <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"7px 16px", borderBottom:`1px solid ${C.border}`, background:i%2===0?C.white:C.bg }}>
                        <div>
                          <div style={{ fontFamily:C.mono, fontSize:11, fontWeight:600, color:C.text }}>{item.sku}</div>
                          <div style={{ fontSize:10, color:C.text3 }}>{item.partName}</div>
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                          <span style={{ fontSize:11, fontWeight:600, color:item.cogs>0?C.accent:C.text3 }}>{item.cogs>0?`$${item.cogs}`:"—"}</span>
                          <button onClick={()=>startEditSku(item,i)} style={{ ...btn, padding:"2px 7px", fontSize:10, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>Edit</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {!generatedSkus&&!selectedBike&&<div style={{ ...card, padding:60, textAlign:"center" }}><div style={{ color:C.text3, marginBottom:10, opacity:0.5 }}>{Ic.tag}</div><div style={{ fontSize:14, color:C.text2 }}>Select a bike to load its part folders</div></div>}
            </div>
          </div>
        </div>
      );
    };



    // ─── SETTINGS PAGE ─────────────────────────────────────────────────────────
    const CHANGELOG = [
      { date:"2026-08-21", type:"feature", text:"Forked to MotoXUniverse — costing activated from launch (ratio:1 equal-placeholder weights, edit in future Parts Master tools), Dashboard overview page added" },
      { date:"2026-05-12", type:"fix", text:"Bug Fix 2/3/4/5: Checklist reload, Part Images modal filter, SKU folder parser, Purchase Price" },
      { date:"2026-05-12", type:"feature", text:"Update 1: Add Part to Checklist (Temporary + Permanent)" },
      { date:"2026-05-12", type:"feature", text:"Update 2: COGS activated — Purchase Price in Ledger, 3-digit cost in SKU (000 until ratios set)" },
      { date:"2026-05-12", type:"fix", text:"Bug Fix: Bike now shows in Part Images and SKU Generator dropdowns" },
      { date:"2026-05-12", type:"fix", text:"Label Fix: Listing # renamed to Year throughout the app" },
      { date:"2026-05-11", type:"feature", text:"Brekke App launched — adapted from PJ Powersports H&R App" },
      { date:"2026-05-11", type:"feature", text:"New SKU format: [Condition][Listing#]-[Model]-[Serial]-[Category]-[PartNum] e.g. U25-YZ450F-17-EX-01" },
      { date:"2026-05-11", type:"feature", text:"119-part Brekke parts list (EX, EN, SS, WL, FR, OS categories)" },
      { date:"2026-05-11", type:"feature", text:"Ledger updated: Condition, Listing #, Bike Model, Internal Serial fields" },
      { date:"2026-05-11", type:"feature", text:"Location / OWN LOC removed — Brekke does not track per-part storage" },
      { date:"2026-05-11", type:"feature", text:"Part Groups page removed — categories built into part codes (EX-01, EN-01, etc.)" },
      { date:"2026-05-11", type:"feature", text:"COGS deferred — SKU format ready, ratios to be added to parts_master when decided" },
    ];

    const SettingsPage = ({ flash, user }) => {
      const [activeTab, setActiveTab] = useState("changelog");
      const [scriptUrl, setScriptUrl] = useState(()=>{ try{ return localStorage.getItem("hr_script_url")||SCRIPT_URL; }catch(e){return SCRIPT_URL;} });
      const [users, setUsers]         = useState([]);
      const [loadingUsers, setLoadingUsers] = useState(false);
      const [savingUsers, setSavingUsers]   = useState(false);
      const [editingUser, setEditingUser]   = useState(null);
      const [newUser, setNewUser]           = useState({ name:"", email:"", password:"", role:"staff" });
      const [showAdd, setShowAdd]           = useState(false);

      useEffect(()=>{
        if(activeTab==="users") {
          setLoadingUsers(true);
          callApi({action:"users_read"}).then(d=>{ if(d.users) setUsers(d.users); }).catch(()=>{}).finally(()=>setLoadingUsers(false));
        }
      },[activeTab]);

      const saveScriptUrl = () => {
        try { localStorage.setItem("hr_script_url", scriptUrl); flash("✓ Script URL saved (reload app to apply)"); }
        catch(e) { flash("⚠ Could not save: "+e.message); }
      };

      const saveUsers = async () => {
        setSavingUsers(true);
        try {
          await callApi({action:"users_write", users});
          flash("✓ Users saved");
        } catch(e) { flash("⚠ Save failed: "+e.message); }
        setSavingUsers(false);
      };

      const addUser = () => {
        if(!newUser.name.trim()||!newUser.email.trim()) { flash("⚠ Name and email required"); return; }
        setUsers(prev=>[...prev, {...newUser, id:Date.now(), status:"active", joined:new Date().toISOString().slice(0,10)}]);
        setNewUser({name:"",email:"",password:"",role:"staff"}); setShowAdd(false);
      };

      const deleteUser = (id) => {
        if(!window.confirm("Remove this user?")) return;
        setUsers(prev=>prev.filter(u=>u.id!==id));
      };

      const typeColor = t => t==="feature"?{bg:C.accentL,color:C.accentD}:{bg:C.orangeL,color:C.orange};

      return (
        <div style={{ animation:"fadeIn 0.2s ease", maxWidth:900, margin:"0 auto" }}>
          <div style={{ marginBottom:20 }}>
            <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>Settings</h1>
            <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>App configuration, changelog and user management</p>
          </div>

          {/* Tabs */}
          <div style={{ display:"flex", gap:2, marginBottom:20 }}>
            {[["changelog","Changelog"],["config","Configuration"],["users","User Management"]].map(([id,label])=>(
              <button key={id} onClick={()=>setActiveTab(id)} style={{ ...btn, background:activeTab===id?C.text:C.white, color:activeTab===id?"#fff":C.text2, border:`1px solid ${C.border}`, padding:"8px 18px" }}>{label}</button>
            ))}
          </div>

          {/* Changelog tab */}
          {activeTab==="changelog"&&(
            <div style={{ ...card, overflow:"hidden" }}>
              <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div style={{ fontSize:13, fontWeight:600, color:C.text }}>Feature + Fix Log</div>
                <div style={{ fontSize:11, color:C.text3 }}>{CHANGELOG.length} entries · Latest first</div>
              </div>
              {CHANGELOG.map((entry,i)=>(
                <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:12, padding:"10px 16px", borderBottom:`1px solid ${C.border}`, background:i%2===0?C.white:C.bg }}>
                  <span style={{ fontSize:10, background:typeColor(entry.type).bg, color:typeColor(entry.type).color, padding:"2px 8px", borderRadius:20, fontWeight:600, flexShrink:0, marginTop:1 }}>{entry.type}</span>
                  <span style={{ fontSize:12, color:C.text, flex:1 }}>{entry.text}</span>
                  <span style={{ fontSize:11, color:C.text3, flexShrink:0, fontFamily:C.mono }}>{entry.date}</span>
                </div>
              ))}
            </div>
          )}

          {/* Config tab */}
          {activeTab==="config"&&(
            <div style={{ ...card, padding:24 }}>
              <div style={{ marginBottom:20 }}>
                <label style={lbl}>Google Apps Script URL</label>
                <div style={{ display:"flex", gap:10 }}>
                  <FI value={scriptUrl} onChange={e=>setScriptUrl(e.target.value)} placeholder="https://script.google.com/macros/s/…/exec" />
                  <button onClick={saveScriptUrl} style={{ ...btn, background:C.text, color:"#fff", flexShrink:0 }}>{Ic.check} Save</button>
                </div>
                <div style={{ fontSize:11, color:C.text3, marginTop:6 }}>Current active URL: <span style={{ fontFamily:C.mono, fontSize:10 }}>{SCRIPT_URL.slice(0,60)}…</span></div>
              </div>
              <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:16 }}>
                <label style={lbl}>App Version</label>
                <div style={{ fontSize:13, color:C.text2 }}>MotoXUniverse Parts Portal · Build 2026-05-12 · {CHANGELOG.length} logged changes</div>
              </div>
            </div>
          )}

          {/* Users tab */}
          {activeTab==="users"&&(
            <div>
              <div style={{ display:"flex", justifyContent:"flex-end", gap:10, marginBottom:12 }}>
                <button onClick={()=>setShowAdd(!showAdd)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>{Ic.plus} Add User</button>
                <button onClick={saveUsers} disabled={savingUsers} style={{ ...btn, background:C.accent, color:"#fff" }}>{savingUsers?Ic.spin:Ic.check} Save Users</button>
              </div>
              {showAdd&&(
                <div style={{ ...card, padding:16, marginBottom:16 }}>
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:10, marginBottom:10 }}>
                    <div><label style={lbl}>Name</label><FI value={newUser.name} onChange={e=>setNewUser({...newUser,name:e.target.value})} placeholder="Full name" /></div>
                    <div><label style={lbl}>Email</label><FI value={newUser.email} onChange={e=>setNewUser({...newUser,email:e.target.value})} placeholder="email@example.com" /></div>
                    <div><label style={lbl}>Password</label><FI type="password" value={newUser.password} onChange={e=>setNewUser({...newUser,password:e.target.value})} placeholder="Password" /></div>
                    <div><label style={lbl}>Role</label>
                      <select value={newUser.role} onChange={e=>setNewUser({...newUser,role:e.target.value})} style={{...inp}}>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                      </select>
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <button onClick={addUser} style={{ ...btn, background:C.text, color:"#fff" }}>{Ic.check} Add</button>
                    <button onClick={()=>setShowAdd(false)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>Cancel</button>
                  </div>
                </div>
              )}
              <div style={{ ...card, overflow:"hidden" }}>
                {loadingUsers?<Spinner />:(
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                    <thead>
                      <tr>
                        {["Name","Email","Role","Status","Joined",""].map((h,i)=>(
                          <th key={i} style={{ padding:"10px 14px", fontSize:11, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:C.text2, background:C.bg, borderBottom:`1px solid ${C.border}`, textAlign:"left" }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {users.length===0&&<tr><td colSpan={6} style={{ padding:32, textAlign:"center", color:C.text3 }}>No users found</td></tr>}
                      {users.map((u,i)=>{
                        const isEditing = editingUser?.id===u.id;
                        return (
                          <tr key={u.id||i} style={{ borderTop:`1px solid ${C.border}`, background:i%2===0?C.white:C.bg }}>
                            <td style={{ padding:"10px 14px" }}>{isEditing?<FI value={editingUser.name} onChange={e=>setEditingUser({...editingUser,name:e.target.value})} style={{padding:"3px 8px",fontSize:12}} />:u.name}</td>
                            <td style={{ padding:"10px 14px", color:C.text2 }}>{isEditing?<FI value={editingUser.email} onChange={e=>setEditingUser({...editingUser,email:e.target.value})} style={{padding:"3px 8px",fontSize:12}} />:u.email}</td>
                            <td style={{ padding:"10px 14px" }}>{isEditing?<select value={editingUser.role} onChange={e=>setEditingUser({...editingUser,role:e.target.value})} style={{...inp,padding:"3px 8px",fontSize:12}}><option value="staff">Staff</option><option value="admin">Admin</option></select>:<span style={{ fontSize:11, background:u.role==="admin"?C.text:C.bg, color:u.role==="admin"?"#fff":C.text2, padding:"1px 8px", borderRadius:20, fontWeight:600 }}>{u.role}</span>}</td>
                            <td style={{ padding:"10px 14px" }}><span style={{ fontSize:11, background:u.status==="active"?C.accentL:C.redL, color:u.status==="active"?C.accentD:C.red, padding:"1px 8px", borderRadius:20 }}>{u.status||"active"}</span></td>
                            <td style={{ padding:"10px 14px", color:C.text3, fontSize:12 }}>{u.joined||"—"}</td>
                            <td style={{ padding:"10px 14px" }}>
                              {isEditing?(
                                <div style={{ display:"flex", gap:6 }}>
                                  <button onClick={()=>{ setUsers(prev=>prev.map(x=>x.id===editingUser.id?editingUser:x)); setEditingUser(null); }} style={{ ...btn, background:C.accent, color:"#fff", padding:"3px 10px", fontSize:11 }}>{Ic.check}</button>
                                  <button onClick={()=>setEditingUser(null)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"3px 8px", fontSize:11 }}>✕</button>
                                </div>
                              ):(
                                <div style={{ display:"flex", gap:6 }}>
                                  <button onClick={()=>setEditingUser({...u})} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"3px 8px", fontSize:11 }}>Edit</button>
                                  <button onClick={()=>deleteUser(u.id)} style={{ ...btn, background:C.redL, color:C.red, padding:"3px 8px", fontSize:11 }}>{Ic.trash}</button>
                                </div>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };


    // ─── PART ROW (shared by checklist sort modes) ─────────────────────────────
    const PartRow = ({ p, isOn, isExc, togglePart, notes, setNotes }) => (
      <div style={{ borderBottom:`1px solid ${C.border}` }}>
        <div onClick={()=>togglePart(p.num)}
          style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 16px", cursor:"pointer", background:isOn?C.accentL+"44":"transparent", transition:"background 0.1s" }}
          onMouseEnter={e=>{ if(!isOn) e.currentTarget.style.background=C.bg; }}
          onMouseLeave={e=>{ if(!isOn) e.currentTarget.style.background="transparent"; }}>
          <div style={{ width:18, height:18, borderRadius:4, background:isOn?C.accent:"transparent", border:isOn?"none":`1.5px solid ${C.border2}`, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
            {isOn&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20,6 9,17 4,12"/></svg>}
          </div>
          <span style={{ fontFamily:C.mono, fontSize:11, color:C.text3, minWidth:38 }}>{String(p.num)}</span>
          <span style={{ fontSize:13, fontWeight:isOn?600:400, color:isOn?C.accentD:C.text, flex:1 }}>{p.name}</span>
          {/* OWN LOC removed for Brekke */}
          {isOn&&<span style={{ fontSize:10, background:C.accentL, color:C.accentD, padding:"1px 6px", borderRadius:3, fontWeight:600 }}>confirmed</span>}
        </div>
        {isOn&&(
          <div style={{ padding:"8px 16px 12px 52px", background:"#f8fdf8", borderTop:`1px solid ${C.border}` }} onClick={e=>e.stopPropagation()}>
            <label style={{ ...lbl, fontSize:10 }}>Notes for {p.name}</label>
            <FI value={notes[String(p.num)]||""} onChange={e=>setNotes(prev=>({...prev,[String(p.num)]:e.target.value}))} placeholder="Condition, damage, missing parts…" style={{ fontSize:12, padding:"5px 10px" }} />
          </div>
        )}
      </div>
    );

    // ─── PARTS CHECKLIST PAGE ──────────────────────────────────────────────────
    const CATEGORY_ORDER = ["EX","EN","SS","WL","FR","OS","Other"]; // Brekke categories
    // Brekke category display names
    const CATEGORY_NAMES = {"EX":"Exhaust","EN":"Engine","SS":"Suspension","WL":"Wheels","FR":"Frame","OS":"Outer / External Systems","Other":"Other"};


    const PartsChecklistPage = ({ bike, masterParts, flash, onSave, onBack, reloadMasterParts }) => {
      const [checked, setChecked]       = useState({});
      const [notes, setNotes]           = useState({});
      const [search, setSearch]         = useState("");
      const [saving, setSaving]         = useState(false);
      const [loading, setLoading]       = useState(true);
      const [sortMode, setSortMode]     = useState("group");
      // Add Part modal state
      const [showAddPart, setShowAddPart]     = useState(false);
      const [addPartName, setAddPartName]     = useState("");
      const [addPartCat, setAddPartCat]       = useState("OS");
      const [addPartCode, setAddPartCode]     = useState("");
      const [addPartType, setAddPartType]     = useState("temporary");
      const [savingPart, setSavingPart]       = useState(false);
      // Session-only temp parts (for current bike this session)
      const [sessionTempParts, setSessionTempParts] = useState([]);

      // Load existing checklist for this bike on mount
      useEffect(()=>{
        setLoading(true);
        const bikeId = bike.internalSerial||(bike.condition||"U")+(bike.listingNum||"")+"-"+(bike.bikeModel||"");
        callApi({ action:"checklist_read", bikeSerial: bikeId })
          .then(d => {
            if(d.items && d.items.length > 0) {
              const c={}, n={};
              const tempFromSheet=[];
              d.items.forEach(item => {
                // Handle both boolean true and string "TRUE" from Google Sheets
                const isOnBike = item.onBike === true || String(item.onBike).toUpperCase() === "TRUE";
                if(isOnBike) {
                  c[String(item.partNum)]=true;
                  n[String(item.partNum)]=item.notes||"";
                  // If part not in masterParts, it's a temp part — restore it for this bike
                  const inMaster = (masterParts||[]).find(p=>String(p.num)===String(item.partNum));
                  if(!inMaster && item.partNum) {
                    tempFromSheet.push({ num:String(item.partNum), name:item.partName||String(item.partNum), category:String(item.partNum).split("-")[0]||"OS", ratio:0 });
                  }
                }
              });
              setChecked(c); setNotes(n);
              if(tempFromSheet.length>0) setSessionTempParts(tempFromSheet);
            }
          }).catch(()=>{}).finally(()=>setLoading(false));
      },[bike.id]);

      // Auto-compute next part code when category changes
      const getNextCode = (cat) => {
        const allParts = [...(masterParts||[]), ...sessionTempParts];
        const catParts = allParts.filter(p=>String(p.num).startsWith(cat+"-"));
        const nums = catParts.map(p=>{ const m=String(p.num).match(/(\d+)$/); return m?parseInt(m[1]):0; });
        const next = nums.length>0 ? Math.max(...nums)+1 : 1;
        return cat+"-"+String(next).padStart(2,"0");
      };

      const handleAddPartOpen = (prefill="") => {
        setAddPartName(prefill);
        setAddPartCode(getNextCode(addPartCat));
        setShowAddPart(true);
      };

      const handleCatChange = (cat) => {
        setAddPartCat(cat);
        setAddPartCode(getNextCode(cat));
      };

      const handleAddPartSave = async () => {
        if(!addPartName.trim()) { flash("⚠ Part name is required"); return; }
        if(!addPartCode.trim()) { flash("⚠ Part code is required"); return; }
        const newPart = { num:addPartCode.trim(), name:addPartName.trim(), category:addPartCat, ratio:0 };
        setSavingPart(true);
        try {
          if(addPartType==="permanent") {
            // Save to parts_master sheet
            const allParts = [...(masterParts||[]), newPart];
            await callApi({ action:"parts_master_write", parts:allParts.map(p=>({num:p.num,name:p.name,category:p.category,ratio:p.ratio||0})) });
            if(reloadMasterParts) await reloadMasterParts();
            flash(`✓ "${newPart.name}" added permanently to parts list`);
          } else {
            // Temporary — session only
            setSessionTempParts(prev=>[...prev, newPart]);
            flash(`✓ "${newPart.name}" added temporarily for this bike`);
          }
          // Immediately tick this part as confirmed
          setChecked(prev=>({...prev,[newPart.num]:true}));
          setShowAddPart(false);
          setAddPartName(""); setAddPartCode("");
        } catch(e) { flash("⚠ Failed to add part: "+e.message); }
        setSavingPart(false);
      };

      const togglePart = (num) => {
        const key = String(num);
        setChecked(prev => {
          const on = !prev[key];
          if(!on) { setNotes(n=>({...n,[key]:""})); }
          return {...prev,[key]:on};
        });
      };

      const confirmedCount = Object.values(checked).filter(Boolean).length;
      // OWN LOC tracking removed for Brekke

      const handleSave = async (goToImages) => {
        setSaving(true);
        try {
          const allSaveParts = [...(masterParts||[]), ...sessionTempParts.filter(tp=>!(masterParts||[]).find(mp=>String(mp.num)===String(tp.num)))];
          const items = allSaveParts.map(p=>({
            partNum: p.num,
            partName: p.name,
            onBike: !!checked[p.num],
            notes: notes[p.num]||"",
            location: "",
          }));
          const bikeId = bike.internalSerial||(bike.condition||"U")+(bike.listingNum||"")+"-"+(bike.bikeModel||"");
          const res = await callApi({ action:"checklist_save", bikeSerial:bikeId, items });
          if(res.error) throw new Error(res.error);
          flash(`✓ Checklist saved — ${confirmedCount} parts confirmed for ${bike.serial}`);
          if(onSave) onSave(bike, goToImages);
        } catch(e) { flash("⚠ Save failed: "+e.message); }
        setSaving(false);
      };

      // Merge masterParts + sessionTempParts for this bike
      const allChecklistParts = [...(masterParts||[]), ...sessionTempParts.filter(tp=>!(masterParts||[]).find(mp=>String(mp.num)===String(tp.num)))];

      // Filter parts by search
      const filteredParts = allChecklistParts.filter(p => {
        if(!search) return true;
        return p.name.toLowerCase().includes(search.toLowerCase()) || String(p.num).includes(search);
      });

      // Group parts by category
      const grouped = {};
      filteredParts.forEach(p => {
        const cat = p.category || "Other";
        if(!grouped[cat]) grouped[cat]=[];
        grouped[cat].push(p);
      });
      const sortedCats = CATEGORY_ORDER.filter(c=>grouped[c]).concat(Object.keys(grouped).filter(c=>!CATEGORY_ORDER.includes(c)));

      // A-Z flat list
      const sortedAZ = [...filteredParts].sort((a,b)=>a.num-b.num);

      return (
        <div style={{ animation:"fadeIn 0.2s ease", maxWidth:900, margin:"0 auto" }}>
          {/* Header */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:12 }}>
            <div>
              <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>Parts Checklist</h1>
              <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>{bike.bikeModel||bike.listingNum||bike.id} · Year {bike.listingNum} · {bike.condition==="N"?"New":"Used"}</p>
            </div>
            <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
              {confirmedCount>0&&<span style={{ fontSize:12, background:C.accentL, color:C.accentD, padding:"3px 10px", borderRadius:20, fontWeight:600 }}>{confirmedCount} confirmed</span>}
              {/* OWN LOC badge removed for Brekke */}
              <button onClick={()=>{ setChecked(Object.fromEntries(allChecklistParts.map(p=>[p.num,true]))); }} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"6px 12px", fontSize:12 }}>Select All</button>
              <button onClick={()=>{ setChecked({}); setNotes({}); }} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"6px 12px", fontSize:12 }}>Clear All</button>
              <button onClick={()=>handleSave(false)} disabled={saving} style={{ ...btn, background:C.accent, color:"#fff", padding:"6px 16px", fontSize:13 }}>{saving?Ic.spin:Ic.check} Save</button>
            </div>
          </div>

          {/* Parts list */}
          <div style={{ ...card, overflow:"hidden", marginBottom:16 }}>
            {/* Search bar + sort toggle */}
            <div style={{ padding:"10px 16px", borderBottom:`1px solid ${C.border}`, display:"flex", gap:10, alignItems:"center" }}>
              <div style={{ position:"relative", flex:1 }}>
                <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)", color:C.text3 }}>{Ic.search}</span>
                <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search parts…" style={{ ...inp, paddingLeft:32 }} />
              </div>
              <div style={{ display:"flex", gap:2, flexShrink:0 }}>
                <button onClick={()=>setSortMode("group")} style={{ ...btn, background:sortMode==="group"?C.text:C.bg, color:sortMode==="group"?"#fff":C.text2, border:`1px solid ${C.border}`, padding:"6px 12px", fontSize:12 }}>By Group</button>
                <button onClick={()=>setSortMode("az")} style={{ ...btn, background:sortMode==="az"?C.text:C.bg, color:sortMode==="az"?"#fff":C.text2, border:`1px solid ${C.border}`, padding:"6px 12px", fontSize:12 }}>By Code</button>
              </div>
            </div>

            {loading?<Spinner />:(
              filteredParts.length===0
                ? <div style={{ padding:40, textAlign:"center", color:C.text3, fontSize:13 }}>
                    No matching parts
                    {search && <div style={{ marginTop:12 }}>
                      <button onClick={()=>handleAddPartOpen(search)} style={{ ...btn, background:C.accentL, color:C.accentD, border:`1px solid ${C.accent}33`, fontSize:12 }}>+ Add "{search}" as a part</button>
                    </div>}
                  </div>
                : sortMode==="az"
                  ? <div>{sortedAZ.map(p => {
                      const isOn = !!checked[String(p.num)];
                      const isExc = EXCEPTION_PARTS.has(p.num);
                      return <PartRow key={p.num} p={p} isOn={isOn} isExc={isExc} togglePart={togglePart} notes={notes} setNotes={setNotes} />;
                    })}</div>
                  : <div>{sortedCats.map(cat=>(
                      <div key={cat}>
                        <div style={{ padding:"6px 16px", background:C.bg, borderBottom:`1px solid ${C.border}`, fontSize:10, fontWeight:700, color:C.text2, letterSpacing:"0.08em", textTransform:"uppercase" }}>
                          {CATEGORY_NAMES[cat]||cat} <span style={{ fontWeight:400, color:C.text3 }}>({cat}) · {grouped[cat].length} parts</span>
                        </div>
                        {grouped[cat].map(p => {
                          const isOn = !!checked[String(p.num)];
                          const isExc = EXCEPTION_PARTS.has(p.num);
                          return <PartRow key={p.num} p={p} isOn={isOn} isExc={isExc} togglePart={togglePart} notes={notes} setNotes={setNotes} />;
                        })}
                      </div>
                    ))}</div>
            )}
          </div>

          {/* Add Part button */}
          <div style={{ marginBottom:12, textAlign:"right" }}>
            <button onClick={()=>handleAddPartOpen("")} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, fontSize:12 }}>+ Add Part</button>
          </div>

          {/* Add Part Modal */}
          {showAddPart && (
            <div style={{ ...card, padding:24, marginBottom:16, border:`1px solid ${C.accent}44`, animation:"fadeIn 0.15s ease" }}>
              <h3 style={{ fontSize:14, fontWeight:700, color:C.text, margin:"0 0 16px" }}>Add New Part</h3>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px, 1fr))", gap:12 }}>
                <div style={{ gridColumn:"1/-1" }}>
                  <label style={lbl}>Part Name *</label>
                  <FI value={addPartName} onChange={e=>setAddPartName(e.target.value)} placeholder="e.g. Breather Pipe" autoFocus />
                </div>
                <div>
                  <label style={lbl}>Category</label>
                  <select value={addPartCat} onChange={e=>handleCatChange(e.target.value)} style={{...inp}}>
                    {["EX","EN","SS","WL","FR","OS"].map(c=><option key={c} value={c}>{c} — {{"EX":"Exhaust","EN":"Engine","SS":"Suspension","WL":"Wheels","FR":"Frame","OS":"Outer Systems"}[c]}</option>)}
                  </select>
                </div>
                <div>
                  <label style={lbl}>Part Code *</label>
                  <FI value={addPartCode} onChange={e=>setAddPartCode(e.target.value)} placeholder="e.g. OS-65" />
                </div>
                <div>
                  <label style={lbl}>Save As</label>
                  <select value={addPartType} onChange={e=>setAddPartType(e.target.value)} style={{...inp}}>
                    <option value="temporary">Temporary (this bike only)</option>
                    <option value="permanent">Permanent (all future bikes)</option>
                  </select>
                </div>
              </div>
              <div style={{ display:"flex", gap:10, marginTop:16 }}>
                <button onClick={handleAddPartSave} disabled={savingPart} style={{ ...btn, background:C.accent, color:"#fff" }}>{savingPart?Ic.spin:Ic.check} {savingPart?"Saving…":"Add Part"}</button>
                <button onClick={()=>{ setShowAddPart(false); setAddPartName(""); }} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>Cancel</button>
              </div>
              {addPartType==="temporary" && <p style={{ fontSize:11, color:C.text3, margin:"10px 0 0" }}>This part will only appear for this bike. It will be saved to this bike's checklist when you save.</p>}
              {addPartType==="permanent" && <p style={{ fontSize:11, color:C.accentD, margin:"10px 0 0" }}>This part will be added to the master parts list and appear on all future bike checklists.</p>}
            </div>
          )}

          {/* Bottom action bar */}
          <div style={{ ...card, padding:"14px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10, marginBottom:40 }}>
            <div style={{ fontSize:13, color:C.text2 }}>
              {confirmedCount} part{confirmedCount!==1?"s":""} confirmed
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={onBack} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>← Back to Ledger</button>
              <button onClick={()=>handleSave(false)} disabled={saving} style={{ ...btn, background:C.accent, color:"#fff" }}>{saving?Ic.spin:Ic.check} {saving?"Saving…":"Save Checklist"}</button>
              <button onClick={()=>handleSave(true)} disabled={saving} style={{ ...btn, background:C.text, color:"#fff" }}>{saving?Ic.spin:Ic.tag} {saving?"Saving…":"Save + Go to Part Images →"}</button>
            </div>
          </div>
        </div>
      );
    };

    // ─── APP ROOT ──────────────────────────────────────────────────────────────
    function App() {
      const [user, setUser]               = useState(null);
      const [page, setPage]               = useState("dashboard");
      const [bikes, setBikes]             = useState([]);
      const [toastMsg, setToastMsg]       = useState("");
      const [masterParts, setMasterParts] = useState([]);
      const [partsLoading, setPartsLoading] = useState(false);
      const [checklistBike, setChecklistBike] = useState(null); // bike being checked

      const flash = (msg) => { setToastMsg(msg); setTimeout(()=>setToastMsg(""), msg.startsWith("⚠")||msg.startsWith("✓ All") ? 8000 : 3500); };

      // ── Load master parts from sheet (auto-seeds with 115 if empty) ──────────
      const loadMasterParts = () => {
        setPartsLoading(true);
        callApi({ action:"parts_master_read", seedData: SEED_PARTS })
          .then(d => {
            if (d.parts && d.parts.length > 0) {
              setMasterParts(d.parts);
            } else {
              // Fallback to seed data if sheet unavailable
              setMasterParts(SEED_PARTS);
            }
          })
          .catch(() => setMasterParts(SEED_PARTS))
          .finally(() => setPartsLoading(false));
      };

      // ── Helper: get parts for a bike (master + temp parts from localStorage) ─
      const getBikeParts = (bikeSerial) => {
        const tempKey = `hr_temp_parts_${bikeSerial}`;
        let tempParts = [];
        try {
          const stored = localStorage.getItem(tempKey);
          if (stored) tempParts = JSON.parse(stored);
        } catch(e) {}
        // Merge: master parts + temp parts, temp parts override by num
        const allParts = [...masterParts];
        tempParts.forEach(tp => {
          if (!allParts.find(p => p.num === tp.num)) allParts.push(tp);
        });
        return allParts;
      };

      // ── Helper: add temp part for a bike ─────────────────────────────────────
      const addTempPart = (bikeSerial, part) => {
        const tempKey = `hr_temp_parts_${bikeSerial}`;
        try {
          const stored = localStorage.getItem(tempKey);
          const existing = stored ? JSON.parse(stored) : [];
          const updated = [...existing.filter(p => p.num !== part.num), { ...part, isTemp: true }];
          localStorage.setItem(tempKey, JSON.stringify(updated));
        } catch(e) {}
        // Also update masterParts state for current session display
        setMasterParts(prev => {
          if (prev.find(p => p.num === part.num)) return prev;
          return [...prev, { ...part, isTemp: true }];
        });
      };

      // ── Helper: clear temp parts for a bike (called after SKU save) ──────────
      const clearTempParts = (bikeSerial) => {
        const tempKey = `hr_temp_parts_${bikeSerial}`;
        try { localStorage.removeItem(tempKey); } catch(e) {}
        // Remove temp parts from state
        setMasterParts(prev => prev.filter(p => !p.isTemp));
      };

      // ── Helper: next available part number ───────────────────────────────────
      const getNextPartNum = () => {
        // For Brekke: part nums are strings like EX-01. Return next custom code hint.
        const maxNum = masterParts.reduce((max, p) => Math.max(max, parseInt(String(p.num).replace(/\D/g,""))||0), 64);
        return maxNum + 1;
      };

      useEffect(() => {
        // Load ledger
        callApi({action:"ledger_read"}).then(d=>{
          const rows=d.values||[];
          const loaded=rows.map((r,i)=>{
            if(!r[0]&&!r[1]) return null;
            const cond=String(r[0]||"U").trim();
            const lNum=String(r[1]||"").trim();
            const mdl=String(r[2]||"").trim();
            const iSer=String(r[3]||"").trim();
            // Detect old 6-col rows: if col4 looks like a Drive ID (long string), treat as old format
            const col4=String(r[4]||"").trim();
            const isOldFormat = col4.length>20 && isNaN(parseFloat(col4));
            const purchasePrice = isOldFormat ? 0 : parseFloat(r[4])||0;
            const driveFolderId = isOldFormat ? col4 : String(r[5]||"").trim();
            const notes = isOldFormat ? String(r[5]||"").trim() : String(r[6]||"").trim();
            return { _rowIndex:i+2, id:iSer||(cond+lNum+"-"+mdl), condition:cond, listingNum:lNum, bikeModel:mdl, internalSerial:iSer, purchasePrice, driveFolderId, notes };
          }).filter(Boolean);
          if(loaded.length) setBikes(loaded);
        }).catch(()=>{});
        // Load master parts
        loadMasterParts();
      },[]);

      if(!user) return <Login onLogin={setUser} />;

      const partsProps = { masterParts, partsLoading, loadMasterParts, getBikeParts, addTempPart, clearTempParts, getNextPartNum };

      // Handle checklist save — optionally navigate to Part Images
      const handleChecklistSave = (bike, goToImages) => {
        const wasFromImages = page === "partimages";
        setChecklistBike(null);
        if(goToImages || wasFromImages) setPage("partimages");
      };

      return (
        <div style={{ minHeight:"100vh", background:C.bg }}>
          <TopNav page={page} setPage={p=>{ setChecklistBike(null); setPage(p); }} user={user} onLogout={()=>{setUser(null);setPage("dashboard");setChecklistBike(null);}} />
          <main style={{ paddingTop:56, padding:"72px 24px 80px" }}>
            <div style={{ maxWidth:1400, margin:"0 auto" }}>
              {checklistBike?(
                <PartsChecklistPage
                  bike={checklistBike}
                  masterParts={masterParts}
                  flash={flash}
                  onSave={handleChecklistSave}
                  onBack={()=>setChecklistBike(null)}
                  reloadMasterParts={loadMasterParts}
                />
              ):(
                <>
                  {page==="dashboard"  && <DashboardPage bikes={bikes} masterParts={masterParts} flash={flash} onChecklist={b=>setChecklistBike(b)} setPage={setPage} />}
                  {page==="ledger"     && <LedgerPage bikes={bikes} setBikes={setBikes} flash={flash} onChecklist={b=>setChecklistBike(b)} />}
                  {page==="partimages" && <PartImagesPage bikes={bikes} flash={flash} {...partsProps} onChecklist={b=>{setChecklistBike(b);}} />}
                  {page==="sku"        && <SkuPage bikes={bikes} flash={flash} {...partsProps} />}
                  {/* Part Groups page removed for Brekke */}
                  {page==="settings"   && <SettingsPage flash={flash} user={user} />}
                </>
              )}
            </div>
          </main>
          <Toast msg={toastMsg} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
