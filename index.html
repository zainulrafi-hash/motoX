                    <div style={{ fontSize:14, fontWeight:700, color:C.text, marginBottom:4 }}>Storage Location</div>
                    <div style={{ fontSize:12, color:C.text2, marginBottom:16 }}>
                      <span style={{ fontWeight:600 }}>{(getBikeParts&&selectedBike?getBikeParts(selectedBike.id):masterParts).find(p=>p.num===modalPartNum)?.name||""}</span>
                      {" "}has its own location. Enter it below or skip to use the default shelf location.
                    </div>
                    <label style={lbl}>Storage Location <span style={{ color:C.text3, fontWeight:400, textTransform:"none", letterSpacing:0 }}>(optional)</span></label>
                    <FI autoFocus value={modalLocation} onChange={e=>setModalLocation(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") confirmAddPart(modalPartNum,modalLocation.trim(),null); }} placeholder="e.g. WH1, FR2… (leave blank to skip)" style={{ marginBottom:16 }} />
                    <div style={{ display:"flex", gap:10 }}>
                      <button onClick={()=>confirmAddPart(modalPartNum,modalLocation.trim(),null)} style={{ ...btn, background:C.text, color:"#fff", flex:1, justifyContent:"center" }}>{Ic.check} Add Folder</button>
                      <button onClick={()=>confirmAddPart(modalPartNum,"",null)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"9px 16px" }}>Skip</button>
                      <button onClick={()=>setModalPartNum(null)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"9px 16px" }}>Back</button>
                    </div>
                  </div>
                ):(
                  <>
                    <div style={{ padding:"16px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                      <div>
                        <div style={{ fontSize:14, fontWeight:700, color:C.text }}>Add Part Folder</div>
                        {selectedPhotos.size>0&&<div style={{ fontSize:11, color:C.accent, marginTop:2 }}>{selectedPhotos.size} photo{selectedPhotos.size!==1?"s":""} will be auto-assigned</div>}
                      </div>
                      <button onClick={()=>{setShowPartModal(false);setPartSearch("");setModalPartNum(null);}} style={{ background:"none", border:"none", cursor:"pointer", color:C.text2, fontSize:20, lineHeight:1 }}>×</button>
                    </div>
                    <div style={{ padding:"12px 20px", borderBottom:`1px solid ${C.border}` }}>
                      <div style={{ position:"relative" }}>
                        <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)", color:C.text3 }}>{Ic.search}</span>
                        <input autoFocus value={partSearch} onChange={e=>setPartSearch(e.target.value)} placeholder="Search part name or number…" style={{ ...inp, paddingLeft:32 }} />
                      </div>
                    </div>
                    <div style={{ overflowY:"auto", flex:1 }}>
                      {filteredParts.length===0&&partSearch&&(
                        <div style={{ padding:16, textAlign:"center" }}>
                          <div style={{ color:C.text3, fontSize:13, marginBottom:10 }}>No parts match "{partSearch}"</div>
                          <button onClick={()=>{ setNewPartName(partSearch); setNewPartNum(String(getNextPartNum?getNextPartNum():116)); setShowNewPartModal(true); }} style={{ ...btn, background:C.text, color:"#fff", fontSize:12 }}>{Ic.plus} Add as New Part</button>
                        </div>
                      )}
                      {filteredParts.map((p)=>{
                        const isConfirmed = checklistConfirmed.includes(String(p.num));
                        return (
                          <button key={p.num} onClick={()=>selectPartInModal(p.num)}
                            style={{ width:"100%", display:"flex", alignItems:"center", gap:14, padding:"11px 20px", background:isConfirmed?"#f0fdf4":"none", border:"none", borderBottom:`1px solid ${C.border}`, cursor:"pointer", fontFamily:"inherit", textAlign:"left", transition:"background 0.1s", borderLeft:isConfirmed?`3px solid ${C.accent}`:"3px solid transparent" }}
                            onMouseEnter={e=>e.currentTarget.style.background=isConfirmed?"#dcfce7":C.bg}
                            onMouseLeave={e=>e.currentTarget.style.background=isConfirmed?"#f0fdf4":"transparent"}>
                            <span style={{ fontFamily:C.mono, fontSize:11, color:p.isTemp?C.orange:C.text3, minWidth:44 }}>{String(p.num)}</span>
                            <span style={{ fontSize:13, color:C.text, fontWeight:isConfirmed?600:500, flex:1 }}>{p.name}</span>
                            {isConfirmed&&<span style={{ fontSize:10, background:"#dcfce7", color:"#16a34a", padding:"1px 6px", borderRadius:3, fontWeight:700 }}>✓ On Bike</span>}
                            {p.isTemp&&<span style={{ fontSize:10, background:C.orangeL, color:C.orange, padding:"1px 6px", borderRadius:3, fontWeight:600 }}>TEMP</span>}
                          </button>
                        );
                      })}
                      {/* Add New Part button at bottom */}
                      <button onClick={()=>{ setNewPartName(partSearch); setNewPartNum(String(getNextPartNum?getNextPartNum():116)); setNewPartRatio("0.001"); setNewPartType("temporary"); setNewPartCategory(""); setShowNewPartModal(true); }}
                        style={{ width:"100%", display:"flex", alignItems:"center", gap:14, padding:"12px 20px", background:C.bg, border:"none", borderTop:`2px solid ${C.border}`, cursor:"pointer", fontFamily:"inherit", color:C.accent, fontWeight:600, fontSize:13 }}>
                        {Ic.plus} Add New Part…
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── PART GROUPS PAGE ──────────────────────────────────────────────────────
    const DEFAULT_GROUPS = {
      "Engine":       [65,66,67,85,87,88,89,90,91,94,96,98,100,101,103,104,108,109,110,111,113,114,115],
      "Brakes":       [21,22,23,24,25,36,37,53,54,61,62],
      "Suspension":   [3,4,18,29,105,106,107],
      "Wheels":       [7,8,63,64],
      "Body":         [1,2,16,40,41,42,43,44,48],
      "Electronics":  [34,35,50,55,57,68,69,75],
      "Drivetrain":   [5,6,13,14,15,17,19,20,26,27,28,30,31,32,33,38,39,45,46,47,49,51,52,56,58,59,60,70,71,72,73,74,76,77,78,79,80,81,82,83,84,86,92,93,95,99,102,112],
    };

    const PartGroupsPage = ({ flash, masterParts, partsLoading, loadMasterParts, getNextPartNum }) => {
      const [groups, setGroups]               = useState(null);
      const [loading, setLoading]             = useState(true);
      const [saving, setSaving]               = useState(false);
      const [search, setSearch]               = useState("");
      const [newGroupName, setNewGroupName]   = useState("");
      const [showAddGroup, setShowAddGroup]   = useState(false);
      const [dragItem, setDragItem]           = useState(null);
      const [dragOver, setDragOver]           = useState(null);
      const [activeTab, setActiveTab]         = useState("groups");
      // Master parts list editing
      const [newPartName, setNewPartName]     = useState("");
      const [newPartCategory, setNewPartCategory] = useState("");
      const [newPartRatio, setNewPartRatio]   = useState("");
      const [editingPartIdx, setEditingPartIdx] = useState(null);
      const [editPartData, setEditPartData]   = useState(null);

      useEffect(()=>{
        setLoading(true);
        callApi({action:"parts_master_read"}).then(d=>{
          if(d.groups) setGroups(d.groups);
          else {
            const g={};
            Object.entries(DEFAULT_GROUPS).forEach(([name,nums])=>{ g[name]=nums.map(n=>{ const mp=(masterParts||[]).find(p=>p.num===n); return mp?{num:n,name:mp.name}:null; }).filter(Boolean); });
            setGroups(g);
          }
        }).catch(()=>{
          const g={};
          Object.entries(DEFAULT_GROUPS).forEach(([name,nums])=>{ g[name]=nums.map(n=>{ const mp=(masterParts||[]).find(p=>p.num===n); return mp?{num:n,name:mp.name}:null; }).filter(Boolean); });
          setGroups(g);
        }).finally(()=>setLoading(false));
      },[masterParts]);

      const saveGroups = async () => {
        setSaving(true);
        try {
          await callApi({action:"parts_master_write", groups, parts:(masterParts||[])});
          if(loadMasterParts) loadMasterParts();
          flash("✓ Groups saved to Google Sheet");
        } catch(e) { flash("⚠ Save failed: "+e.message); }
        setSaving(false);
      };

      const addGroup = () => {
        if(!newGroupName.trim()) return;
        setGroups(prev=>({...prev,[newGroupName.trim()]:[]}));
        setNewGroupName(""); setShowAddGroup(false);
        flash(`✓ Group "${newGroupName.trim()}" added`);
      };

      const deleteGroup = (name) => {
        if(!window.confirm(`Delete group "${name}"?`)) return;
        setGroups(prev=>{ const n={...prev}; delete n[name]; return n; });
        flash(`✓ Group "${name}" deleted`);
      };

      const movePart = (partNum, partName, fromGroup, toGroup) => {
        setGroups(prev=>{
          const n={...prev};
          if(fromGroup) n[fromGroup]=(n[fromGroup]||[]).filter(p=>p.num!==partNum);
          if(toGroup) { if(!n[toGroup]) n[toGroup]=[]; if(!n[toGroup].find(p=>p.num===partNum)) n[toGroup]=[...n[toGroup],{num:partNum,name:partName}]; }
          return n;
        });
      };

      const removeFromGroup = (partNum, groupName) => {
        setGroups(prev=>({ ...prev, [groupName]:(prev[groupName]||[]).filter(p=>p.num!==partNum) }));
      };

      // Drag handlers
      const onDragStart = (e, item) => { setDragItem(item); e.dataTransfer.effectAllowed="move"; };
      const onDrop = (e, toGroup) => {
        e.preventDefault();
        if(!dragItem||dragItem.fromGroup===toGroup) { setDragItem(null); setDragOver(null); return; }
        movePart(dragItem.num, dragItem.name, dragItem.fromGroup, toGroup);
        setDragItem(null); setDragOver(null);
      };

      // Master parts CRUD
      const addMasterPart = () => {
        if(!newPartName.trim()) { flash("⚠ Part name required"); return; }
        const maxNum = getNextPartNum ? getNextPartNum() : Math.max(...masterParts.map(p=>p.num), 115) + 1;
        const newPart = { num:maxNum, name:newPartName.trim(), ratio:parseFloat(newPartRatio)||0.001, category:newPartCategory.trim() };
        setNewPartName(""); setNewPartCategory(""); setNewPartRatio("");
        flash(`✓ ${newPart.name} added`);
      };

      const deleteMasterPart = async (num) => {
        if(!window.confirm("Delete this part from the master list?")) return;
        const updated = masterParts.filter(p=>p.num!==num);
        try { await callApi({action:"parts_master_write", parts:updated, groups:groups||{}}); if(loadMasterParts) loadMasterParts(); } catch(e) { flash("⚠ Delete failed"); }
        flash("✓ Part deleted");
      };

      const savePartEdit = async () => {
        const updated = masterParts.map(p=>p.num===editPartData.num?editPartData:p);
        try { await callApi({action:"parts_master_write", parts:updated, groups:groups||{}}); if(loadMasterParts) loadMasterParts(); flash("✓ Part updated"); } catch(e) { flash("⚠ Update failed: "+e.message); }
        setEditingPartIdx(null); setEditPartData(null);
      };

      const filteredMaster = (masterParts||[]).filter(p=>{ if(!search) return true; const q=search.toLowerCase(); return p.name.toLowerCase().includes(q)||String(p.num).includes(q); });

      if(loading) return <div style={{ padding:40 }}><Spinner /></div>;

      return (
        <div style={{ animation:"fadeIn 0.2s ease" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
            <div>
              <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>Part Groups</h1>
              <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>Manage part categories and the master parts list</p>
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={()=>{ if(loadMasterParts){ loadMasterParts(); flash("↻ Reloading parts…"); } }} disabled={partsLoading} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>
                {partsLoading?Ic.spin:"↻"} Reload Parts
              </button>
              <button onClick={saveGroups} disabled={saving} style={{ ...btn, background:C.accent, color:"#fff" }}>
                {saving?Ic.spin:Ic.check} Save to Sheet
              </button>
            </div>
          </div>

          {/* Tabs */}
          <div style={{ display:"flex", gap:2, marginBottom:20 }}>
            {[["groups","Part Groups"],["master","Master Parts List"]].map(([id,label])=>(
              <button key={id} onClick={()=>setActiveTab(id)} style={{ ...btn, background:activeTab===id?C.text:C.white, color:activeTab===id?"#fff":C.text2, border:`1px solid ${C.border}`, padding:"8px 18px" }}>{label}</button>
            ))}
          </div>

          {activeTab==="groups"&&(
            <div>
              <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:16, gap:10 }}>
                {showAddGroup?(
                  <div style={{ display:"flex", gap:8 }}>
                    <FI autoFocus value={newGroupName} onChange={e=>setNewGroupName(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addGroup(); if(e.key==="Escape") setShowAddGroup(false); }} placeholder="Group name…" style={{ width:200 }} />
                    <button onClick={addGroup} style={{ ...btn, background:C.text, color:"#fff", padding:"9px 16px" }}>{Ic.check}</button>
                    <button onClick={()=>setShowAddGroup(false)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"9px 12px" }}>✕</button>
                  </div>
                ):(
                  <button onClick={()=>setShowAddGroup(true)} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>{Ic.plus} Add Group</button>
                )}
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(300px,1fr))", gap:16 }}>
                {Object.entries(groups||{}).map(([groupName, parts])=>(
                  <div key={groupName}
                    onDragOver={e=>{ e.preventDefault(); setDragOver(groupName); }}
                    onDragLeave={()=>setDragOver(null)}
                    onDrop={e=>onDrop(e,groupName)}
                    style={{ ...card, overflow:"hidden", outline:dragOver===groupName?`2px solid ${C.accent}`:"none", transition:"outline 0.1s" }}>
                    <div style={{ padding:"12px 16px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", justifyContent:"space-between", background:C.bg }}>
                      <div style={{ fontWeight:700, fontSize:13, color:C.text }}>{groupName} <span style={{ fontWeight:400, color:C.text3, fontSize:11 }}>({parts.length})</span></div>
                      <button onClick={()=>deleteGroup(groupName)} style={{ background:"none", border:"none", color:C.red, cursor:"pointer", padding:"2px 4px" }}>{Ic.trash}</button>
                    </div>
                    <div style={{ maxHeight:280, overflowY:"auto", padding:"4px 0" }}>
                      {parts.length===0&&<div style={{ padding:"12px 16px", fontSize:12, color:C.text3 }}>Drop parts here</div>}
                      {parts.map(p=>(
                        <div key={p.num} draggable onDragStart={e=>onDragStart(e,{num:p.num,name:p.name,fromGroup:groupName})}
                          style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 16px", cursor:"grab", borderBottom:`1px solid ${C.border}`, transition:"background 0.1s" }}
                          onMouseEnter={e=>e.currentTarget.style.background=C.bg}
                          onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                          <span style={{ fontFamily:C.mono, fontSize:10, color:C.text3, minWidth:22 }}>{String(p.num).padStart(2,"0")}</span>
                          <span style={{ fontSize:12, flex:1, color:C.text }}>{p.name}</span>
                          <button onClick={()=>removeFromGroup(p.num,groupName)} style={{ background:"none", border:"none", color:C.text3, cursor:"pointer", padding:"1px 4px", fontSize:11 }}>✕</button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop:16, fontSize:12, color:C.text3 }}>💡 Drag parts between groups to reorganize. Changes are saved when you click "Save to Sheet".</div>
            </div>
          )}

          {activeTab==="master"&&(
            <div>
              {/* Search + add */}
              <div style={{ display:"flex", gap:12, marginBottom:16, alignItems:"center" }}>
                <div style={{ position:"relative", flex:1, maxWidth:320 }}>
                  <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)", color:C.text3 }}>{Ic.search}</span>
                  <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search parts…" style={{ ...inp, paddingLeft:32 }} />
                </div>
              </div>
              {/* Add new part form */}
              <div style={{ ...card, padding:16, marginBottom:16 }}>
                <div style={{ fontSize:12, fontWeight:700, color:C.text3, letterSpacing:"0.07em", textTransform:"uppercase", marginBottom:12 }}>Add New Part</div>
                <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr auto", gap:10, alignItems:"flex-end" }}>
                  <div><label style={lbl}>Part Name</label><FI value={newPartName} onChange={e=>setNewPartName(e.target.value)} placeholder="e.g. Oil Cooler" /></div>
                  <div><label style={lbl}>Category</label><FI value={newPartCategory} onChange={e=>setNewPartCategory(e.target.value)} placeholder="e.g. Engine" /></div>
                  <div><label style={lbl}>Ratio (e.g. 0.01)</label><FI type="number" step="0.001" value={newPartRatio} onChange={e=>setNewPartRatio(e.target.value)} placeholder="0.01" /></div>
                  <button onClick={addMasterPart} style={{ ...btn, background:C.text, color:"#fff", padding:"9px 16px" }}>{Ic.plus} Add</button>
                </div>
              </div>
              {/* Parts table */}
              <div style={{ ...card, overflow:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                  <thead>
                    <tr>
                      {["#","Part Name","Category","Ratio","Actions"].map(h=>(
                        <th key={h} style={{ padding:"10px 14px", fontSize:11, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:C.text2, background:C.bg, borderBottom:`1px solid ${C.border}`, textAlign:"left" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filteredMaster.map((p,i)=>{
                      const isEditing=editingPartIdx===i;
                      return (
                        <tr key={p.num} style={{ borderTop:`1px solid ${C.border}`, background:i%2===0?C.white:C.bg }}>
                          <td style={{ padding:"9px 14px", fontFamily:C.mono, color:C.text3, fontSize:11 }}>{String(p.num).padStart(2,"0")}</td>
                          <td style={{ padding:"9px 14px", fontWeight:500, color:C.text }}>
                            {isEditing?<FI value={editPartData.name} onChange={e=>setEditPartData({...editPartData,name:e.target.value})} style={{padding:"3px 8px",fontSize:12}} />:p.name}
                          </td>
                          <td style={{ padding:"9px 14px", color:C.text2 }}>
                            {isEditing?<FI value={editPartData.category||""} onChange={e=>setEditPartData({...editPartData,category:e.target.value})} style={{padding:"3px 8px",fontSize:12,width:120}} />:(p.category||"—")}
                          </td>
                          <td style={{ padding:"9px 14px", fontFamily:C.mono, color:C.text2 }}>
                            {isEditing?<FI type="number" step="0.001" value={editPartData.ratio} onChange={e=>setEditPartData({...editPartData,ratio:parseFloat(e.target.value)||0})} style={{padding:"3px 8px",fontSize:12,width:90}} />:`${(p.ratio*100).toFixed(3)}%`}
                          </td>
                          <td style={{ padding:"9px 14px" }}>
                            {isEditing?(
                              <div style={{ display:"flex", gap:6 }}>
                                <button onClick={savePartEdit} style={{ ...btn, background:C.accent, color:"#fff", padding:"3px 10px", fontSize:11 }}>{Ic.check}</button>
                                <button onClick={()=>{setEditingPartIdx(null);setEditPartData(null);}} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"3px 8px", fontSize:11 }}>✕</button>
                              </div>
                            ):(
                              <div style={{ display:"flex", gap:6 }}>
                                <button onClick={()=>{setEditingPartIdx(i);setEditPartData({...p});}} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}`, padding:"3px 8px", fontSize:11 }}>Edit</button>
                                <button onClick={()=>deleteMasterPart(p.num)} style={{ ...btn, background:C.redL, color:C.red, padding:"3px 8px", fontSize:11 }}>{Ic.trash}</button>
                              </div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── SKU GENERATOR ─────────────────────────────────────────────────────────
    const SkuPage = ({ bikes, flash, masterParts, partsLoading, loadMasterParts, getBikeParts, addTempPart, clearTempParts, getNextPartNum }) => {
      const [selectedBike, setSelectedBike]     = useState(null);
      const [driveFolders, setDriveFolders]     = useState([]);
      const [loadingFolders, setLoadingFolders] = useState(false);
      const [partLocations, setPartLocations]   = useState({});
      const [generatedSkus, setGeneratedSkus]   = useState(null);
      const [saving, setSaving]                 = useState(false);
      const [savedSkus, setSavedSkus]           = useState([]);
      const [loadingSaved, setLoadingSaved]     = useState(false);
      const [checklistItems, setChecklistItems] = useState([]);
      const [copyMsg, setCopyMsg]               = useState("");
      const [unassignedCount, setUnassignedCount] = useState(0);
      const [skuSearch, setSkuSearch]           = useState("");
      const [sortMode, setSortMode]             = useState("num");  // "num" | "group"
      const [folderOrder, setFolderOrder]       = useState([]);
      const [dragIdx, setDragIdx]               = useState(null);
      const [dragOverIdx, setDragOverIdx]       = useState(null);
      // Saved SKU editing
      const [editingSkuIdx, setEditingSkuIdx]   = useState(null);
      const [editSkuData, setEditSkuData]       = useState(null);
      // Part search (feature 7)
      const [partMasterSearch, setPartMasterSearch] = useState("");
      const [showPartSearch, setShowPartSearch] = useState(false);
      const [folderSearchSKU, setFolderSearchSKU] = useState("");
      // Groups for grouping (loaded from sheet via PartGroupsPage pattern)
      const [groups, setGroups]                 = useState(null);

      const getPartNumFromFolderName = (name) => {
        const s = String(name);
        // Brekke format: "EX-01 - Name" or "EX-01 Name"
        const m = s.match(/^([A-Z]{2}-\d+)\s*[-–]?\s*/);
        if(m) return m[1];
        // Legacy numeric: "03 - Name"
        const m2 = s.match(/^(\d+)\s*[-–]/);
        if(m2) return m2[1];
        return null;
      };
      const getCleanName = (name) => {
        const s = String(name);
        // Remove "EX-01 - " prefix
        return s.replace(/^[A-Z]{2}-\d+\s*[-–]\s*/,"").replace(/^\d+\s*[-–]\s*/,"").trim();
      };

      useEffect(()=>{
        // Load groups from sheet
        callApi({action:"parts_master_read"}).then(d=>{
          if(d.groups) setGroups(d.groups);
          else {
            const g={};
            Object.entries(DEFAULT_GROUPS).forEach(([name,nums])=>{ g[name]=nums.map(n=>{ const mp=masterParts.find(p=>p.num===n); return mp?{num:n,name:mp.name}:null; }).filter(Boolean); });
            setGroups(g);
          }
        }).catch(()=>{
          const g={};
          Object.entries(DEFAULT_GROUPS).forEach(([name,nums])=>{ g[name]=nums.map(n=>{ const mp=masterParts.find(p=>p.num===n); return mp?{num:n,name:mp.name}:null; }).filter(Boolean); });
          setGroups(g);
        });
      },[masterParts]);

      useEffect(()=>{
        if(!selectedBike?.driveFolderId) { setDriveFolders([]); setSavedSkus([]); setChecklistItems([]); return; }
        setLoadingFolders(true); setDriveFolders([]); setGeneratedSkus(null); setPartLocations({});
        Promise.all([
          callApi({action:"drive_folder_contents",folderId:selectedBike.driveFolderId}),
          callApi({action:"sku_read"}),
          callApi({action:"checklist_read",bikeSerial:selectedBike.internalSerial||(selectedBike.condition||"U")+(selectedBike.listingNum||"")+"-"+(selectedBike.bikeModel||"")})
        ]).then(([driveData,skuData,checklistData])=>{
          const folders=(driveData.subfolders||[]).map(sf=>({...sf,partNum:getPartNumFromFolderName(sf.name),cleanName:getCleanName(sf.name)}));
          setDriveFolders(folders); setFolderOrder(folders.map((_,i)=>i));
          const checklist=(checklistData.items||[]);
          setChecklistItems(checklist);
          const locs={};
          checklist.forEach(item=>{ if(item.location) locs[String(item.partNum)]=item.location; });
          setPartLocations(locs);
          const assignedFolderNums=new Set(folders.filter(sf=>sf.partNum).map(sf=>sf.partNum));
          const unassignedConfirmed=checklist.filter(i=>!assignedFolderNums.has(i.partNum)).length;
          setUnassignedCount(checklist.length>0 ? unassignedConfirmed : (driveData.photos||[]).length);
          const bikeKey=selectedBike.internalSerial||(selectedBike.condition||"U")+(selectedBike.listingNum||"")+"-"+(selectedBike.bikeModel||"");
          setSavedSkus((skuData.items||[]).filter(i=>i.bikeSerial===bikeKey));
        }).catch(()=>flash("⚠ Could not load bike data"))
        .finally(()=>setLoadingFolders(false));
      },[selectedBike]);

      // ── Export SKU Labels to Word ────────────────────────────────────────────
      const exportLabels = async () => {
        if(!savedSkus||savedSkus.length===0) { flash("⚠ No saved SKUs to export"); return; }
        try {
          flash("⏳ Generating Word file…");
          const { Document, Packer, Paragraph, TextRun, AlignmentType, ImageRun, BorderStyle } = window.docx;

          // Generate barcode PNGs using JsBarcode + canvas
          const generateBarcode = (text) => {
            const canvas = document.createElement("canvas");
            try {
              JsBarcode(canvas, text, {
                format: "CODE128",
                width: 2,
                height: 60,
                displayValue: false,
                margin: 4,
              });
              return canvas.toDataURL("image/png").split(",")[1]; // base64
            } catch(e) { return null; }
          };

          const border = { style: BorderStyle.SINGLE, size: 4, color: "CCCCCC" };
          const children = [];

          savedSkus.forEach((item, idx) => {
            const barcodeB64 = generateBarcode(item.sku);
            // Barcode image
            if(barcodeB64) {
              children.push(new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { before: idx===0?0:240, after: 0 },
                children: [new ImageRun({
                  data: Uint8Array.from(atob(barcodeB64), c=>c.charCodeAt(0)),
                  transformation: { width: 280, height: 70 },
                  type: "png",
                })]
              }));
            }
            // SKU text
            children.push(new Paragraph({
              alignment: AlignmentType.CENTER,
              spacing: { before: 0, after: 0 },
              children: [new TextRun({ text: item.sku, font: "Arial", size: 21, bold: true })]
            }));
            // Part name
            children.push(new Paragraph({
              alignment: AlignmentType.CENTER,
              spacing: { before: 0, after: idx<savedSkus.length-1?160:0 },
              border: idx<savedSkus.length-1?{ bottom: { style: BorderStyle.SINGLE, size: 2, color: "DDDDDD", space: 4 } }:undefined,
              children: [new TextRun({ text: item.partName||"", font: "Arial", size: 21 })]
            }));
          });

          const doc = new Document({
            sections: [{
              properties: {
                page: {
                  size: { width: 12240, height: 15840 },
                  margin: { top: 1080, right: 2160, bottom: 1080, left: 2160 }
                }
              },
              children
            }]
          });

          const buffer = await Packer.toBuffer(doc);
          const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const bikeName = selectedBike ? `${selectedBike.condition||"U"}${selectedBike.listingNum||""}-${selectedBike.bikeModel||""}` : "motoxuniverse";
          a.href = url; a.download = `SKU-Labels-${bikeName}.docx`; a.click();
          URL.revokeObjectURL(url);
          flash("✓ Labels exported as Word file");
        } catch(e) {
          flash("⚠ Export failed: "+e.message);
          console.error("Export error:", e);
        }
      };

      // OWN LOC / Exception parts removed for Brekke
      const isException = (n) => false;
      const allExceptionsHaveLocation = true;

      // Get part ratio — from passed masterParts (includes temp parts for bike)
      const getRatio = (partNum, bikeSerial) => {
        const allParts = getBikeParts && bikeSerial ? getBikeParts(bikeSerial) : masterParts;
        const mp = allParts.find(p=>String(p.num)===String(partNum));
        return mp?.ratio || 0;
      };

      // Get group for a part number
      const getGroupForPart = (partNum) => {
        // For Brekke, group = category from part code prefix (EX, EN, SS, WL, FR, OS)
        const s = String(partNum||"");
        const prefix = s.split("-")[0];
        const catNames = {"EX":"Exhaust","EN":"Engine","SS":"Suspension","WL":"Wheels","FR":"Frame","OS":"Outer Systems"};
        return catNames[prefix] || "Other";
      };

      const CAT_ORDER = ["EX","EN","SS","WL","FR","OS"];
      const sortByCode = (a, b) => {
        const cA=String(a.partNum||"ZZ-99"), cB=String(b.partNum||"ZZ-99");
        const pA=cA.split("-")[0], pB=cB.split("-")[0];
        const nA=parseInt(cA.split("-")[1])||0, nB=parseInt(cB.split("-")[1])||0;
        const iA=CAT_ORDER.indexOf(pA)>=0?CAT_ORDER.indexOf(pA):99;
        const iB=CAT_ORDER.indexOf(pB)>=0?CAT_ORDER.indexOf(pB):99;
        if(iA!==iB) return iA-iB;
        return nA-nB;
      };
      const getOrderedFolders = () => {
        const ordered = folderOrder.map(i=>driveFolders[i]).filter(Boolean);
        if(sortMode==="num") return [...ordered].sort(sortByCode);
        if(sortMode==="group") return [...ordered].sort(sortByCode);
        return ordered;
      };

      const generateSkus = (genSortMode) => {
        if(!selectedBike) { flash("⚠ Select a bike first"); return; }
        if(driveFolders.length===0) { flash("⚠ No part folders found"); return; }
        // Merge any checklist locations not yet in partLocations
        const mergedLocs = {...partLocations};
        checklistItems.forEach(item=>{ if(item.location && !mergedLocs[String(item.partNum)]) mergedLocs[String(item.partNum)]=item.location; });
        // Check exceptions — satisfied if checklist or entered
        // No OWN LOC check for Brekke
        if(unassignedCount>0) { if(!window.confirm(`⚠ ${unassignedCount} photo${unassignedCount!==1?"s":""} still unassigned. Generate SKUs anyway?`)) return; }

        const purchasePrice=selectedBike.purchasePrice||0;
        const partsToProcess=driveFolders.filter(sf=>sf.partNum);
        const totalRatio=partsToProcess.reduce((sum,sf)=>sum+getRatio(sf.partNum,selectedBike?.id),0);

        let ordered=getOrderedFolders().filter(sf=>sf.partNum);
        if(genSortMode==="group") {
          const groupOrder=Object.keys(groups||{});
          ordered=[...ordered].sort((a,b)=>{
            const ga=getGroupForPart(a.partNum), gb=getGroupForPart(b.partNum);
            const ia=groupOrder.indexOf(ga), ib=groupOrder.indexOf(gb);
            if(ia!==ib) return (ia===-1?999:ia)-(ib===-1?999:ib);
            return (a.partNum||999)-(b.partNum||999);
          });
        }

        const items=ordered.map(sf=>{
          const ratio=getRatio(sf.partNum,selectedBike?.id);
          const rawCogs = totalRatio>0?(ratio/totalRatio)*purchasePrice:0;
          const cogs = ratio>0 ? Math.max(1, Math.round(rawCogs)) : 0;
          const checklistEntry = checklistItems.find(c=>String(c.partNum)===String(sf.partNum));
          const location = mergedLocs[String(sf.partNum)]||"";
          const partNotes = checklistEntry?.notes||"";
          // Brekke SKU format: [condition][listingNum]-[bikeModel]-[internalSerial]-[categoryCode]-[partNum]
          // COGS deferred — not included in SKU yet
          const conditionCode = (selectedBike.condition||"U").toUpperCase();
          const listingN = selectedBike.listingNum||"";
          const bikeModel = selectedBike.bikeModel||"";
          const intSerial = selectedBike.internalSerial||"";
          const partCode = String(sf.partNum); // e.g. EX-01
          const cogsStr = String(cogs).padStart(3,"0");
          const sku=`${conditionCode}${listingN}-${bikeModel}-${intSerial}-${partCode}-${cogsStr}`.replace(/\s+/g,"-").trim();
          return {partNum:sf.partNum,partName:sf.cleanName,folderName:sf.name,cogs,location:"",sku,driveFolderId:sf.id||"",group:getGroupForPart(sf.partNum),notes:partNotes};
        });

        // Penny reconciliation (only when purchasePrice > 0)
        if(purchasePrice>0) {
          const totalCogs=items.reduce((s,i)=>s+i.cogs,0);
          const diff=purchasePrice-totalCogs;
          if(diff!==0&&items.length>0) {
            const sorted=[...items].sort((a,b)=>getRatio(b.partNum)-getRatio(a.partNum));
            sorted[0].cogs+=Math.round(diff);
            const condC=(selectedBike.condition||"U").toUpperCase();
            const cogsStr=String(sorted[0].cogs).padStart(3,"0");
            sorted[0].sku=`${condC}${selectedBike.listingNum||""}-${selectedBike.bikeModel||""}-${selectedBike.internalSerial||""}-${String(sorted[0].partNum)}-${cogsStr}`.replace(/\s+/g,"-").trim();
          }
        }
        setGeneratedSkus(items);
        flash(`✓ Generated ${items.length} SKU${items.length!==1?"s":""}`);
      };

      const saveSkus = async () => {
        if(!generatedSkus||generatedSkus.length===0) return;
        setSaving(true);
        try {
          const bikeKey=selectedBike.internalSerial||(selectedBike.condition||"U")+(selectedBike.listingNum||"")+"-"+(selectedBike.bikeModel||"");
          const items=generatedSkus.map(item=>({bikeSerial:bikeKey,partNum:item.partNum,partName:item.partName,sku:item.sku,cogs:item.cogs,shelfLocation:item.location,driveFolderId:item.driveFolderId,notes:item.notes||""}));
          const res=await callApi({action:"sku_save_batch",items});
          if(res.success) {
            // Re-read SKUs to get real row indices
            const skuData = await callApi({action:"sku_read"});
            const fresh = (skuData.items||[]).filter(i=>i.bikeSerial===(selectedBike.internalSerial||(selectedBike.condition||'U')+(selectedBike.listingNum||'')+'-'+(selectedBike.bikeModel||'')));
            setSavedSkus(fresh);
            // Mark SKU Created in checklist
            await callApi({action:"checklist_mark_sku", bikeSerial:selectedBike.internalSerial||(selectedBike.condition||'U')+(selectedBike.listingNum||'')+'-'+(selectedBike.bikeModel||''), partNums:items.map(i=>i.partNum)}).catch(()=>{});
            setGeneratedSkus(null); setPartLocations({});
            flash(`✓ ${items.length} SKUs saved (${res.updated||0} updated, ${res.added||0} new)`);
          } else flash("⚠ Save failed: "+(res.error||""));
        } catch(e) { flash("⚠ Save error: "+e.message); }
        setSaving(false);
      };

      const refreshCosts = async () => {
        if(!selectedBike||savedSkus.length===0) { flash("⚠ No saved SKUs to refresh"); return; }
        if(!window.confirm(`Recalculate COGS for all ${savedSkus.length} saved SKUs? This will update the Google Sheet.`)) return;
        const purchasePrice=selectedBike.purchasePrice||0;
        const allParts=getBikeParts?getBikeParts(selectedBike.id):masterParts;
        const totalRatio=savedSkus.reduce((sum,s)=>sum+getRatio(s.partNum,selectedBike.id),0);
        const updated=savedSkus.map(s=>{
          const ratio=getRatio(s.partNum,selectedBike.id);
          const newCogs=Math.max(1,Math.round(totalRatio>0?(ratio/totalRatio)*purchasePrice:1));
          const conditionCode=(selectedBike.condition||"U").toUpperCase();
          const listingN=selectedBike.listingNum||"";
          const bikeModel=selectedBike.bikeModel||"";
          const intSerial=selectedBike.internalSerial||"";
          const cogsStr=String(newCogs).padStart(3,"0");
          const newSku=`${conditionCode}${listingN}-${bikeModel}-${intSerial}-${String(s.partNum)}-${cogsStr}`.replace(/\s+/g,"-").trim();
          // Carry notes from checklist if not already on saved SKU
          const checklistEntry = checklistItems.find(c=>c.partNum===s.partNum);
          const notes = s.notes||(checklistEntry?.notes||"");
          return {...s,cogs:newCogs,sku:newSku,notes};
        });
        setSaving(true);
        try {
          // Use bikeSerial+partNum as key — no rowIndex dependency
          for(const s of updated) {
            await callApi({action:"sku_update",bikeSerial:s.bikeSerial,partNum:s.partNum,partName:s.partName,sku:s.sku,cogs:s.cogs,shelfLocation:s.shelfLocation,driveFolderId:s.driveFolderId||""});
          }
          setSavedSkus(updated); flash(`✓ Refreshed ${updated.length} SKU costs`);
        } catch(e) { flash("⚠ Refresh failed: "+e.message); }
        setSaving(false);
      };

      const startEditSku = (item, idx) => {
        if(!window.confirm("Edit this saved SKU? This will overwrite the saved value.")) return;
        setEditingSkuIdx(idx); setEditSkuData({...item});
      };

      const saveSkuEdit = async () => {
        if(!editSkuData) return;
        try {
          if(editSkuData._rowIndex&&editSkuData._rowIndex<9000) await callApi({action:"sku_update",rowIndex:editSkuData._rowIndex,...editSkuData});
          setSavedSkus(prev=>prev.map((s,i)=>i===editingSkuIdx?editSkuData:s));
          setEditingSkuIdx(null); setEditSkuData(null);
          flash("✓ SKU updated");
        } catch(e) { flash("⚠ Update failed: "+e.message); }
      };

      const deleteSkuRow = async (item, idx) => {
        if(!window.confirm(`Delete SKU "${item.sku}"?`)) return;
        setSavedSkus(prev=>prev.filter((_,i)=>i!==idx));
        flash("✓ SKU removed from view (not deleted from sheet — delete from Google Sheets if needed)");
      };

      const copySkus = () => {
        if(!generatedSkus) return;
        const text=generatedSkus.map(i=>`${i.sku}\t${i.partName}\t$${i.cogs}`).join("\n");
        navigator.clipboard.writeText(text).then(()=>{ setCopyMsg("Copied!"); setTimeout(()=>setCopyMsg(""),2000); });
      };

      // Drag to reorder folders
      const onFolderDragStart = (e, idx) => { setDragIdx(idx); e.dataTransfer.effectAllowed="move"; };
      const onFolderDrop = (e, toIdx) => {
        e.preventDefault();
        if(dragIdx===null||dragIdx===toIdx) { setDragIdx(null); setDragOverIdx(null); return; }
        setFolderOrder(prev=>{ const n=[...prev]; const [moved]=n.splice(dragIdx,1); n.splice(toIdx,0,moved); return n; });
        setDragIdx(null); setDragOverIdx(null);
      };

      const orderedFolders = getOrderedFolders();
      const filteredSaved = savedSkus.filter(s=>{ if(!skuSearch) return true; const q=skuSearch.toLowerCase(); return s.sku.toLowerCase().includes(q)||s.partName.toLowerCase().includes(q); });
      const activeParts = getBikeParts && selectedBike ? getBikeParts(selectedBike.id) : masterParts;
      const filteredMasterSearch = activeParts.filter(p=>{ if(!partMasterSearch) return true; const q=partMasterSearch.toLowerCase(); return p.name.toLowerCase().includes(q)||String(p.num).includes(q); });

      return (
        <div style={{ animation:"fadeIn 0.2s ease" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
            <div>
              <h1 style={{ fontFamily:C.display, fontSize:22, fontWeight:800, color:C.text, margin:0 }}>SKU Generator</h1>
              <p style={{ fontSize:13, color:C.text2, margin:"4px 0 0" }}>Generate SKUs and COGS based on part folders in Drive</p>
            </div>
            <button onClick={()=>{ if(loadMasterParts) { loadMasterParts(); flash("↻ Reloading parts…"); } }} disabled={partsLoading} style={{ ...btn, background:C.bg, color:C.text2, border:`1px solid ${C.border}` }}>
              {partsLoading?Ic.spin:"↻"} {partsLoading?"Loading…":"Reload Parts"}
            </button>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 400px", gap:16, alignItems:"start" }}>
            {/* LEFT */}
            <div style={{ display:"flex", flexDirection:"column", gap:16 }}>

              {/* Step 1 */}
              <div style={{ ...card, padding:20 }}>
                <div style={{ fontSize:12, fontWeight:700, color:C.text3, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:14 }}>Step 1 — Select Bike</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12 }}>
                  <div>
                    <label style={lbl}>Bike</label>
                    <select value={selectedBike?.id||""} onChange={e=>{ const b=bikes.find(bk=>bk.id===e.target.value); setSelectedBike(b||null); setGeneratedSkus(null); setPartLocations({}); }} style={{ ...inp }}>
                      <option value="">— select —</option>
                      {bikes.map(b=><option key={b.id} value={b.id}>{b.condition}{b.listingNum} — {b.bikeModel}{b.internalSerial ? ` · ${b.internalSerial}` : ""}</option>)}
                    </select>
                  </div>
                  {selectedBike&&<>
                    <div><label style={lbl}>Purchase Price</label><div style={{ padding:"9px 12px", background:C.bg, borderRadius:7, border:`1px solid ${C.border}`, fontSize:13, fontWeight:600 }}>{fmt$(selectedBike.purchasePrice)}</div></div>
                    <div><label style={lbl}>Default Location</label><div style={{ padding:"9px 12px", background:C.bg, borderRadius:7, border:`1px solid ${C.border}`, fontSize:13, color:C.text2 }}>{selectedBike.shelfLocation||"Not set"}</div></div>
                  </>}
                </div>
              </div>

              {/* Step 2: Drive folders */}
              {selectedBike&&(
                <div style={{ ...card, overflow:"hidden" }}>
                  <div style={{ padding:"14px 20px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:12, fontWeight:700, color:C.text3, letterSpacing:"0.08em", textTransform:"uppercase" }}>Step 2 — Part Folders from Drive</div>
                      <div style={{ fontSize:11, color:C.text3, marginTop:2 }}>Drag rows to reorder · Sort by number or group</div>
                    </div>
                    {unassignedCount>0&&<div style={{ fontSize:11, background:C.amberL, color:C.amber, padding:"3px 10px", borderRadius:20, fontWeight:600 }}>⚠ {unassignedCount} unassigned</div>}
                    {/* Sort mode */}
                    <div style={{ display:"flex", gap:4 }}>
                      {[["num","By Number"],["group","By Group"]].map(([m,l])=>(
                        <button key={m} onClick={()=>setSortMode(m)} style={{ ...btn, background:sortMode===m?C.text:C.bg, color:sortMode===m?"#fff":C.text2, border:`1px solid ${C.border}`, padding:"4px 10px", fontSize:11 }}>{l}</button>
                      ))}
                    </div>
                    <div style={{ fontSize:12, color:C.accent, fontWeight:600 }}>{driveFolders.length} folder{driveFolders.length!==1?"s":""}</div>
                  </div>
                  {/* Folder search */}
                  <div style={{ padding:"8px 12px", borderBottom:`1px solid ${C.border}`, background:C.bg }}>
                    <div style={{ position:"relative" }}>
                      <span style={{ position:"absolute", left:9, top:"50%", transform:"translateY(-50%)", color:C.text3, fontSize:12 }}>{Ic.search}</span>
                      <input value={folderSearchSKU} onChange={e=>setFolderSearchSKU(e.target.value)} placeholder="Search folders…" style={{ ...inp, paddingLeft:28, fontSize:12, padding:"5px 10px 5px 28px" }} />
                      {folderSearchSKU&&<button onClick={()=>setFolderSearchSKU("")} style={{ position:"absolute", right:8, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", color:C.text3, cursor:"pointer", fontSize:13 }}>×</button>}
                    </div>
                  </div>
                  {loadingFolders?<Spinner />:(
                    <div style={{ maxHeight:400, overflowY:"auto" }}>
                      {driveFolders.length===0&&<div style={{ padding:32, textAlign:"center", color:C.text3, fontSize:13 }}>No part folders found in Drive. Create them in Part Images first.</div>}
                      {orderedFolders.filter(sf=>!folderSearchSKU||sf.name.toLowerCase().includes(folderSearchSKU.toLowerCase())||String(sf.partNum||"").toLowerCase().includes(folderSearchSKU.toLowerCase())).map((sf,i)=>{
                        const hasNum=!!sf.partNum;
                        const isExc=sf.partNum&&isException(sf.partNum);
                        const grp=sf.partNum?getGroupForPart(sf.partNum):"";
                        return (
                          <div key={sf.id||sf.name}
                            draggable onDragStart={e=>onFolderDragStart(e,i)} onDragOver={e=>{e.preventDefault();setDragOverIdx(i);}} onDragLeave={()=>setDragOverIdx(null)} onDrop={e=>onFolderDrop(e,i)}
                            style={{ borderBottom:`1px solid ${C.border}`, outline:dragOverIdx===i?`2px solid ${C.accent}`:"none" }}>
                            <div style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 16px", cursor:"grab", background:hasNum?"transparent":C.redL+"33" }}>
                              <span style={{ color:C.text3, fontSize:14, flexShrink:0 }}>⠿</span>
                              <span style={{ fontFamily:C.mono, fontSize:11, color:hasNum?C.text3:C.red, minWidth:24 }}>{sf.partNum?String(sf.partNum).padStart(2,"00"):"?"}</span>
                              <div style={{ flex:1 }}>
                                <div style={{ fontSize:13, fontWeight:500, color:C.text }}>{sf.cleanName}</div>
                                {grp&&<div style={{ fontSize:10, color:C.text3 }}>{grp}</div>}
                              </div>
                              {/* OWN LOC removed for Brekke */}
                              {!hasNum&&<span style={{ fontSize:10, background:C.redL, color:C.red, padding:"1px 6px", borderRadius:3, fontWeight:600 }}>NO MATCH</span>}
                            </div>
                            {isExc&&(()=>{
                              const locVal = partLocations[String(sf.partNum)]||"";
                              const fromChecklist = checklistItems.find(c=>c.partNum===sf.partNum&&c.location);
                              return (
                                <div style={{ padding:"6px 16px 10px 50px", background:"#fffbeb", borderTop:`1px solid ${C.border}` }}>
                                  {fromChecklist&&!partLocations[String(sf.partNum)]?(
                                    // Auto-filled from checklist — show as confirmed badge
                                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                                      <span style={{ fontSize:11, color:C.accentD }}>✓ Location from checklist: <strong>{fromChecklist.location}</strong></span>
                                      <button onClick={()=>setPartLocations(prev=>({...prev,[String(sf.partNum)]:fromChecklist.location}))} style={{ fontSize:10, background:"none", border:`1px solid ${C.border}`, borderRadius:4, padding:"1px 8px", cursor:"pointer", color:C.text2 }}>Override</button>
                                    </div>
                                  ):(
                                    <div>
                                      <label style={{ ...lbl, fontSize:10 }}>Location for {sf.cleanName} {fromChecklist&&<span style={{ color:C.accent, fontWeight:400 }}>(from checklist)</span>}</label>
                                      <FI value={locVal} onChange={e=>setPartLocations(prev=>({...prev,[String(sf.partNum)]:e.target.value}))} placeholder="e.g. WH1" style={{ fontSize:12, padding:"5px 10px" }} />
                                    </div>
                                  )}
                                </div>
                              );
                            })()}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}

              {/* Generate buttons */}
              {selectedBike&&driveFolders.length>0&&(
                <div style={{ display:"flex", gap:10 }}>
                  <button onClick={()=>generateSkus("num")} style={{ ...btn, background:C.text, color:"#fff", padding:"12px 20px", fontSize:13, flex:1, justifyContent:"center", borderRadius:8 }}>
                    {Ic.tag} Generate by Folder Number
                  </button>
                  <button onClick={()=>generateSkus("group")} style={{ ...btn, background:C.text2, color:"#fff", padding:"12px 20px", fontSize:13, flex:1, justifyContent:"center", borderRadius:8 }}>
                    {Ic.tag} Generate by Part Group
                  </button>
                </div>
              )}

              {/* Part search (Feature 7) */}
              {selectedBike&&(
                <div style={{ ...card, overflow:"hidden" }}>

                      return (
                        <div key={i}>
                          {showGroupHeader&&<div style={{ padding:"5px 16px", background:C.bg, fontSize:10, fontWeight:700, color:C.text2, letterSpacing:"0.08em", textTransform:"uppercase", borderBottom:`1px solid ${C.border}` }}>{item.group}</div>}

                            <div>
                              <div style={{ fontFamily:C.mono, fontSize:12, fontWeight:600, color:C.text }}>{item.sku}</div>
                              <div style={{ fontSize:11, color:C.text3, marginTop:1 }}>{item.partName}</div>
                            </div>
                            <div style={{ textAlign:"right" }}>
                              <div style={{ fontSize:12, fontWeight:600, color:item.cogs>0?C.accent:C.text3 }}>{item.cogs>0?`$${item.cogs}`:"—"}</div>

                            </div>
                          </div>
                        </div>

                  <div style={{ padding:"10px 16px", background:C.bg, borderTop:`1px solid ${C.border}`, display:"flex", justifyContent:"space-between", fontSize:12 }}>

              {selectedBike&&savedSkus.length>0&&!generatedSkus&&(
